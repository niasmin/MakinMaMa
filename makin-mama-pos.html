<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>มากิน มาม่า — ระบบบริหารร้าน</title>
</head>
<body>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #F3F5F9;
    --line: #E3E7EF;
    --cream: #16233D;
    --cream-dim: #6B7688;
    --chili: #E5352B;
    --chili-dim: #FCEAEA;
    --yolk: #F5B400;
    --scallion: #2F6FE0;
    --broth: #8C9AB3;
  }
  *{box-sizing:border-box;}
  #mm-root{
    font-family:'Sarabun',sans-serif;
    background:#F7F8FB;
    color:var(--cream);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  #mm-root h1,#mm-root h2,#mm-root h3,.mm-num,.mm-tabbtn,.mm-add-btn,.mm-brand{
    font-family:'Kanit',sans-serif;
  }
  .mm-header{
    padding:14px 16px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;
  }
  .mm-logo{width:48px;height:48px;border-radius:50%;object-fit:cover;box-shadow:0 1px 4px rgba(22,35,61,.15);flex-shrink:0;}
  .mm-user-badge{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
  .mm-user-name{font-size:12.5px;font-weight:600;color:var(--cream);white-space:nowrap;}
  .mm-logout-btn{background:none;border:1px solid var(--line);color:var(--cream-dim);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;white-space:nowrap;}
  .mm-brand{font-size:22px;font-weight:700;color:var(--cream);letter-spacing:.2px;}
  .mm-brand span{color:var(--chili);}
  .mm-sub{font-size:12.5px;color:var(--cream-dim);margin-top:2px;}
  .mm-tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(22,35,61,.05);}
  .mm-tabbtn{background:none;border:none;color:var(--cream-dim);padding:12px 11px 10px;font-size:13.5px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;}
  .mm-tabbtn.active{color:var(--cream);border-bottom-color:var(--yolk);}
  .mm-body{padding:14px 12px 90px;max-width:640px;margin:0 auto;}
  .mm-section-title{font-size:15px;font-weight:600;color:var(--cream-dim);margin:16px 2px 8px;}
  .mm-section-title:first-child{margin-top:2px;}
  .mm-hint{font-size:12px;color:var(--cream-dim);margin:-4px 2px 10px;line-height:1.6;}

  .mm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
  .mm-tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;cursor:pointer;color:var(--cream);box-shadow:0 1px 2px rgba(22,35,61,.06);}
  .mm-tile:active{background:var(--surface-2);}
  .mm-tile.set{border-color:var(--yolk);}
  .mm-tile-name{font-size:14.5px;font-weight:600;}
  .mm-tile-price{font-size:13px;color:var(--scallion);margin-top:3px;font-family:'Kanit',sans-serif;font-weight:600;}
  .mm-free-note{display:flex;gap:8px;align-items:center;background:#EAF1FD;border:1px dashed var(--scallion);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--scallion);margin-top:10px;font-weight:500;}
  .mm-banner{background:#FFF6D9;border:1px solid #F0CB63;border-radius:10px;padding:10px 12px;font-size:13px;color:#7A5B00;margin-bottom:12px;font-weight:500;}

  .mm-ticket{background:var(--surface);border:1px solid var(--line);margin-top:18px;position:relative;box-shadow:0 2px 8px rgba(22,35,61,.07);
    clip-path: polygon(0 0,100% 0,100% 100%,96% 97%,92% 100%,88% 97%,84% 100%,80% 97%,76% 100%,72% 97%,68% 100%,64% 97%,60% 100%,56% 97%,52% 100%,48% 97%,44% 100%,40% 97%,36% 100%,32% 97%,28% 100%,24% 97%,20% 100%,16% 97%,12% 100%,8% 97%,4% 100%,0 97%);
    padding:14px 16px 26px;}
  .mm-ticket-title{font-size:14px;font-weight:600;color:var(--cream-dim);margin-bottom:8px;}
  .mm-ticket-row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line);}
  .mm-ticket-total{display:flex;justify-content:space-between;font-size:19px;font-weight:700;margin-top:10px;color:var(--scallion);font-family:'Kanit',sans-serif;}
  .mm-checkout{width:100%;background:var(--chili);color:#fff;border:none;border-radius:8px;padding:13px;font-size:16px;font-weight:600;margin-top:12px;cursor:pointer;font-family:'Kanit',sans-serif;}
  .mm-checkout:disabled{background:#E3E7EF;color:#9AA3B2;cursor:not-allowed;}
  .mm-clear{width:100%;background:none;border:1px solid var(--line);color:var(--cream-dim);border-radius:8px;padding:9px;font-size:13px;margin-top:8px;cursor:pointer;}
  .mm-pay-toggle{display:flex;gap:8px;margin-top:10px;}
  .mm-pay-btn{flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--cream-dim);border-radius:8px;padding:9px;font-size:13.5px;cursor:pointer;}
  .mm-pay-btn.active{border-color:var(--yolk);color:#7A5B00;background:#FFF6D9;font-weight:600;}

  .mm-list-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(22,35,61,.05);}
  .mm-li-main{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .mm-li-sub{font-size:12px;color:var(--cream-dim);margin-top:2px;}
  .mm-li-amount{font-size:15px;color:var(--scallion);font-family:'Kanit',sans-serif;font-weight:600;white-space:nowrap;}
  .mm-del{background:none;border:none;color:var(--chili);font-size:18px;cursor:pointer;padding:2px 6px;}
  .mm-badge{font-size:10.5px;padding:2px 7px;border-radius:20px;font-weight:600;}
  .mm-badge.low{background:var(--chili-dim);color:var(--chili);}
  .mm-badge.ok{background:#EAF1FD;color:var(--scallion);}
  .mm-adj{display:flex;gap:4px;}
  .mm-adj button{background:var(--surface-2);border:1px solid var(--line);color:var(--cream);width:28px;height:28px;border-radius:6px;font-size:15px;cursor:pointer;}

  .mm-form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:6px;}
  .mm-form-row{display:flex;gap:8px;margin-bottom:8px;}
  .mm-field{flex:1;min-width:0;}
  .mm-field label{display:block;font-size:11.5px;color:var(--cream-dim);margin-bottom:4px;}
  .mm-field input,.mm-field select{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--cream);border-radius:6px;padding:9px 10px;font-size:14px;font-family:'Sarabun',sans-serif;}
  .mm-add-btn{width:100%;background:var(--yolk);color:#3A2B00;border:none;border-radius:8px;padding:11px;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;}
  .mm-add-btn.secondary{background:none;border:1px solid var(--broth);color:var(--cream);}
  .mm-check-row{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:6px 2px;color:var(--cream-dim);}

  .mm-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
  .mm-stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px;box-shadow:0 1px 2px rgba(22,35,61,.05);}
  .mm-stat-label{font-size:12px;color:var(--cream-dim);}
  .mm-stat-value{font-size:21px;font-weight:700;font-family:'Kanit',sans-serif;margin-top:4px;}
  .mm-stat.profit .mm-stat-value{color:var(--scallion);}
  .mm-stat.loss .mm-stat-value{color:var(--chili);}
  .mm-bar-row{margin:10px 0;}
  .mm-bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .mm-bar-track{background:var(--surface-2);border-radius:6px;height:10px;overflow:hidden;}
  .mm-bar-fill{height:100%;border-radius:6px;}
  .mm-empty{color:var(--cream-dim);font-size:13.5px;text-align:center;padding:24px 10px;}
  .mm-export-btn{width:100%;background:none;border:1px solid var(--broth);color:var(--cream);border-radius:8px;padding:10px;font-size:13.5px;margin-top:6px;cursor:pointer;}
  .mm-sheets-note{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--cream-dim);margin-top:14px;line-height:1.6;}
  .mm-cat-toggle{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .mm-cat-chip{background:var(--surface);border:1px solid var(--line);color:var(--cream-dim);border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer;}
  .mm-cat-chip.active{background:var(--chili);border-color:var(--chili);color:#fff;}
  .mm-toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--cream);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;font-family:'Kanit',sans-serif;opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;z-index:50;box-shadow:0 4px 14px rgba(22,35,61,.25);}
  .mm-toast.show{opacity:1;bottom:20px;}

  .mm-rank-item{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .mm-rank-item .n{color:var(--cream-dim);width:20px;}
  .mm-rank-item .name{flex:1;}
  .mm-rank-item .count{color:var(--scallion);font-family:'Kanit',sans-serif;font-weight:600;}

  .mm-lock{display:flex;flex-direction:column;align-items:center;padding:50px 20px;text-align:center;}
  .mm-lock-icon{font-size:34px;margin-bottom:10px;}
  .mm-lock input{width:160px;text-align:center;letter-spacing:6px;font-size:20px;background:var(--surface-2);border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:10px;margin:14px 0;}

  .mm-qrbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;margin-top:12px;}
  .mm-qrbox .amt{color:#111;font-family:'Kanit',sans-serif;font-weight:700;font-size:18px;margin-top:8px;}
  .mm-qrbox .name{color:#555;font-size:12px;}

  .mm-shift-live{background:#EAF1FD;border:1px solid var(--scallion);border-radius:10px;padding:14px;margin-bottom:14px;}
  .mm-shift-live .t{color:var(--scallion);font-weight:600;font-size:14px;margin-bottom:6px;}

  /* Tablet & larger screens */
  @media (min-width:700px){
    .mm-body{max-width:900px;padding:20px 24px 90px;}
    .mm-header{padding:20px 28px;}
    .mm-tabs{padding:0 20px;justify-content:center;flex-wrap:wrap;overflow-x:visible;}
    .mm-tabbtn{font-size:14.5px;padding:14px 16px 12px;}
    .mm-stat-grid{grid-template-columns:repeat(4,1fr);}
    .mm-form-row{gap:12px;}
    .mm-list-item{padding:13px 16px;}
    .mm-lock{padding:70px 20px;}
  }
  @media (min-width:1100px){
    .mm-body{max-width:1080px;}
  }
  /* Comfortable touch targets on touch devices */
  @media (pointer:coarse){
    .mm-tabbtn{padding-top:14px;padding-bottom:12px;}
    .mm-add-btn,.mm-checkout,.mm-pay-btn,.mm-tile,.mm-adj button{min-height:44px;}
  }
</style>

<div id="mm-root">
  <div class="mm-header">
    <img class="mm-logo" id="mm-header-logo" src="" alt="Makin Mama logo"/>
    <div style="flex:1;">
      <div class="mm-brand">มากิน <span>มาม่า</span></div>
      <div class="mm-sub">ระบบบริหารร้านครบวงจร</div>
    </div>
    <div id="mm-user-badge" class="mm-user-badge"></div>
  </div>
  <div class="mm-tabs" id="mm-tabs"></div>
  <div class="mm-body" id="mm-body"></div>
  <div class="mm-toast" id="mm-toast"></div>
</div>

    {id:'dash', label:'📊 สรุปยอด'},
    {id:'settings', label:'⚙️ ตั้งค่าระบบ'},
  ];
  const LOCKED_TABS = ['costs','dash'];

  let state = {
    tab:'pos', loaded:false,
    menu:null, toppings:null, setMenus:null, costs:null, orders:null,
    stock:null, waste:null, settings:null, staff:null,
    cart:[], costCatFilter:'ทั้งหมด', unlocked:false, pinInput:'',
    currentUser:null, loginInput:'',
    lastRefresh:null, inbound:null,
  };

  const DEFAULT_MENU = [
    {id:'m1', name:'ต้มยำ', price:25, stockId:null, useQty:0},
    {id:'m2', name:'ต้นตำรับ', price:20, stockId:null, useQty:0},
    {id:'m3', name:'ต้มยำกุ้ง', price:30, stockId:null, useQty:0},
    {id:'m4', name:'ปูอัด', price:25, stockId:null, useQty:0},
  ];
  const DEFAULT_TOPPINGS = [
    {id:'t1', name:'ไข่ต้ม', price:5, stockId:null, useQty:0},
    {id:'t2', name:'ลูกชิ้นเนื้อ', price:5, stockId:null, useQty:0},
    {id:'t3', name:'เนื้อสไลซ์', price:10, stockId:null, useQty:0},
    {id:'t4', name:'เห็ดรวม', price:5, stockId:null, useQty:0},
    {id:'t5', name:'ชีส', price:10, stockId:null, useQty:0},
  ];
  const DEFAULT_SET_MENUS = [];
  const DEFAULT_COSTS = [
    {id:'c1', name:'ค่าเช่าร้าน', category:'ค่าเช่า', amount:8000, frequency:'รายเดือน', date:null},
    {id:'c2', name:'ค่าน้ำ-ค่าไฟ', category:'สาธารณูปโภค', amount:2000, frequency:'รายเดือน', date:null},
    {id:'c3', name:'ค่าแรงลูกจ้าง', category:'ค่าแรง', amount:9000, frequency:'รายเดือน', date:null},
    {id:'c4', name:'น้ำแข็ง', category:'วัตถุดิบ', amount:40, frequency:'รายวัน', date:null},
    {id:'c5', name:'มาม่า + วัตถุดิบหลัก', category:'วัตถุดิบ', amount:300, frequency:'รายวัน', date:null},
  ];
  const CATEGORIES = ['ค่าเช่า','สาธารณูปโภค','ค่าแรง','วัตถุดิบ','ภาษี','ซ่อมบำรุง','อื่นๆ'];
  const DEFAULT_STOCK = [
    {id:'s1', name:'เส้นมาม่า', unit:'ห่อ', qty:100, lowThreshold:20, costPerUnit:6},
    {id:'s2', name:'ไข่', unit:'ฟอง', qty:60, lowThreshold:12, costPerUnit:4},
    {id:'s3', name:'ผักสด', unit:'กก.', qty:10, lowThreshold:2, costPerUnit:35},
    {id:'s4', name:'น้ำแข็ง', unit:'กก.', qty:20, lowThreshold:5, costPerUnit:10},
  ];
  const DEFAULT_SETTINGS = {ownerPin:'', freeCostPerOrder:3, estimatedBowlsPerMonth:600};

  function uid(){ return Math.random().toString(36).slice(2,9); }
  function baht(n){ return Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:0}); }
  // Validation helpers: guard against null/undefined/empty/negative input before calc or save
  function posNum(v, fallback){ const n = Number(v); return (v===''||v===null||v===undefined||isNaN(n)||n<0) ? (fallback===undefined?null:fallback) : n; }
  function posInt(v, fallback){ const n = posNum(v, fallback); return n===null ? null : Math.floor(n); }
  function cleanStr(v){ return (v===null||v===undefined) ? '' : String(v).trim(); }
  function toast(msg){
    const t = document.getElementById('mm-toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove('show'), 1700);
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  const LS_PREFIX = 'mm_';
  async function loadKey(key, fallback){
    try{
      const raw = window.localStorage.getItem(LS_PREFIX+key);
      return raw!==null ? JSON.parse(raw) : fallback;
    }catch(e){ console.error('load failed', key, e); return fallback; }
  }
  async function save(key, val){
    try{ window.localStorage.setItem(LS_PREFIX+key, JSON.stringify(val)); return true; }
    catch(e){ console.error('save failed', key, e); toast('บันทึกไม่สำเร็จ (พื้นที่จัดเก็บเต็มหรือถูกบล็อก)'); return false; }
  }

  async function load(){
    state.menu = await loadKey('menu', DEFAULT_MENU);
    state.toppings = await loadKey('toppings', DEFAULT_TOPPINGS);
    state.setMenus = await loadKey('setMenus', DEFAULT_SET_MENUS);
    state.costs = await loadKey('costs', DEFAULT_COSTS);
    state.orders = await loadKey('orders', []);
    state.stock = await loadKey('stock', DEFAULT_STOCK);
    state.waste = await loadKey('waste', []);
    state.settings = await loadKey('settings', DEFAULT_SETTINGS);
    state.staff = await loadKey('staff', []);
    state.inbound = await loadKey('inbound', []);
    state.loaded = true;
    state.lastRefresh = new Date();
    const headerLogo = document.getElementById('mm-header-logo');
    if(headerLogo) headerLogo.src = LOGO_SRC;
    render();
  }

  let refreshTimer = null;
  function startAutoRefresh(){
    if(refreshTimer) return;
    refreshTimer = setInterval(refreshData, 8000);
  }
  function stopAutoRefresh(){
    if(refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; }
  }
  async function refreshData(){
    const [orders, stock, inbound] = await Promise.all([
      loadKey('orders', state.orders), loadKey('stock', state.stock), loadKey('inbound', state.inbound),
    ]);
    state.orders = orders; state.stock = stock; state.inbound = inbound;
    state.lastRefresh = new Date();
    if(state.tab==='dash' || state.tab==='stock') render();
  }

  function setTab(id){
    if(LOCKED_TABS.includes(id) && state.settings.ownerPin && !state.unlocked){
      state.tab = id; state.pinInput=''; render(); return;
    }
    state.tab = id;
    if(id==='dash'){ startAutoRefresh(); } else { stopAutoRefresh(); }
    render();
  }

  // ---------- LOGIN ----------
  async function addStaff(name, code){
    if(!name) return;
    state.staff.push({id:uid(), name, code:code||''});
    await save('staff', state.staff); render(); toast('เพิ่มพนักงานแล้ว');
  }
  async function deleteStaff(id){ state.staff = state.staff.filter(s=>s.id!==id); await save('staff', state.staff); render(); }
  function loginAs(name){
    if(!name || !name.trim()) return;
    state.currentUser = {name: name.trim()};
    state.loginInput = '';
    state.tab = 'pos';
    render();
    toast('เข้าสู่ระบบในชื่อ '+name.trim());
  }
  function loginSubmit(){
    const val = state.loginInput.trim();
    if(!val) return;
    const match = state.staff.find(s=>s.code && s.code===val) || state.staff.find(s=>s.name===val);
    loginAs(match ? match.name : val);
  }
  function logout(){ state.currentUser = null; render(); }

  function renderLogin(){
    const staffTiles = state.staff.map(s=>`
      <div class="mm-tile" style="text-align:center;" data-login-as="${escapeHtml(s.name)}">
        <div class="mm-tile-name">${escapeHtml(s.name)}</div>
        ${s.code?'<div class="mm-tile-price">รหัส '+escapeHtml(s.code)+'</div>':''}
      </div>`).join('');
    return `
      <div class="mm-lock">
        <img src="${LOGO_SRC}" alt="Makin Mama" style="width:96px;height:96px;border-radius:50%;object-fit:cover;box-shadow:0 2px 10px rgba(22,35,61,.18);margin-bottom:6px;"/>
        <div style="font-size:20px;font-weight:700;font-family:'Kanit',sans-serif;">มากิน <span style="color:var(--chili);">มาม่า</span></div>
      </div>
      ${staffTiles? '<div class="mm-grid" style="margin-top:4px;">'+staffTiles+'</div>' : ''}
      <div class="mm-form" style="margin-top:16px;">
        <div class="mm-form-row"><div class="mm-field"><label>รหัสพนักงาน หรือ ชื่อ</label><input id="login-input" value="${escapeHtml(state.loginInput)}" placeholder="เช่น 001 หรือ ชื่อจริง"/></div></div>
        <button class="mm-add-btn" id="mm-login-btn">เข้าใช้งาน</button>
      </div>
    `;
  }

  // ---------- POS ----------
  function cartTotal(){ return state.cart.reduce((s,i)=>s+i.price,0); }
  function cartBowlCount(){ return state.cart.filter(i=>i.kind!=='stock').length; }
  function addBowl(m){ state.cart.push({key:uid(), kind:'menu', refId:m.id, name:m.name, toppingIds:[], price:m.price}); render(); }
  function addSet(s){ state.cart.push({key:uid(), kind:'set', refId:s.id, name:s.name, toppingIds:[], price:s.price}); render(); }
  function toggleTopping(cartKey, topping){
    const item = state.cart.find(c=>c.key===cartKey); if(!item) return;
    const idx = item.toppingIds.indexOf(topping.id);
    if(idx>-1){ item.toppingIds.splice(idx,1); item.price -= topping.price; }
    else { item.toppingIds.push(topping.id); item.price += topping.price; }
    render();
  }
  function removeCartItem(key){ state.cart = state.cart.filter(c=>c.key!==key); render(); }

  // Pre-portioned grab-and-go stock packs: 1:1 integer quick-tap
  function addStockPack(stockItem){
    const existing = state.cart.find(c=>c.kind==='stock' && c.refId===stockItem.id);
    const already = existing ? existing.qty : 0;
    if(already + 1 > stockItem.qty){ toast('สต๊อก '+stockItem.name+' เหลือไม่พอ'); return; }
    if(existing){ existing.qty += 1; existing.price = existing.qty * existing.unitPrice; }
    else { state.cart.push({key:uid(), kind:'stock', refId:stockItem.id, name:stockItem.name, unitPrice:stockItem.sellPrice, qty:1, price:stockItem.sellPrice}); }
    render();
  }
  function stepStockCartQty(key, delta){
    const item = state.cart.find(c=>c.key===key); if(!item) return;
    const stockItem = state.stock.find(s=>s.id===item.refId);
    const newQty = item.qty + delta;
    if(newQty<=0){ state.cart = state.cart.filter(c=>c.key!==key); render(); return; }
    if(stockItem && newQty > stockItem.qty){ toast('สต๊อก '+item.name+' เหลือไม่พอ'); return; }
    item.qty = newQty; item.price = item.qty * item.unitPrice;
    render();
  }

  async function checkout(){
    if(state.cart.length===0) return;
    const order = {
      id: uid(), time: new Date().toISOString(),
      items: state.cart.map(c=>({
        name:c.name, kind:c.kind,
        toppings:(c.toppingIds||[]).map(tid=>{const t=state.toppings.find(x=>x.id===tid);return t?t.name:'';}),
        toppingIds: c.toppingIds||[],
        qty: c.kind==='stock' ? c.qty : 1,
        price:c.price, refKind:c.kind, refId:c.refId,
      })),
      total: cartTotal(), bowlCount: cartBowlCount(),
      cashierName: state.currentUser ? state.currentUser.name : null,
    };
    // stock deduction
    state.cart.forEach(item=>{
      if(item.kind==='stock'){
        const s = state.stock.find(x=>x.id===item.refId);
        if(s) s.qty = Math.max(0, s.qty - item.qty);
        return;
      }
      let stockId=null, useQty=0;
      if(item.kind==='menu'){ const m=state.menu.find(x=>x.id===item.refId); if(m&&m.stockId){stockId=m.stockId;useQty=m.useQty||0;} }
      if(stockId && useQty>0){
        const s = state.stock.find(x=>x.id===stockId);
        if(s) s.qty = Math.max(0, s.qty - useQty);
      }
      (item.toppingIds||[]).forEach(tid=>{
        const t = state.toppings.find(x=>x.id===tid);
        if(t && t.stockId && t.useQty>0){
          const s = state.stock.find(x=>x.id===t.stockId);
          if(s) s.qty = Math.max(0, s.qty - t.useQty);
        }
      });
    });
    state.orders.push(order);
    await Promise.all([save('orders', state.orders), save('stock', state.stock)]);
    state.cart = [];
    render();
    toast('บันทึกออเดอร์แล้ว ฿'+baht(order.total));
  }

  function renderPOS(){
    const menuTiles = state.menu.map(m=>`
      <div class="mm-tile" data-add-bowl="${m.id}">
        <div class="mm-tile-name">${escapeHtml(m.name)}</div>
        <div class="mm-tile-price">฿${baht(m.price)}</div>
      </div>`).join('');
    const setTiles = state.setMenus.map(s=>`
      <div class="mm-tile set" data-add-set="${s.id}">
        <div class="mm-tile-name">🍱 ${escapeHtml(s.name)}</div>
        <div class="mm-tile-price">฿${baht(s.price)}</div>
      </div>`).join('');
    const packTiles = state.stock.filter(s=>s.sellDirect).map(s=>`
      <div class="mm-tile" data-add-pack="${s.id}" style="${s.qty<=0?'opacity:.4;pointer-events:none;':''}">
        <div class="mm-tile-name">📦 ${escapeHtml(s.name)}</div>
        <div class="mm-tile-price">฿${baht(s.sellPrice)} · เหลือ ${s.qty}</div>
      </div>`).join('');

    const cartHtml = state.cart.map(item=>{
      if(item.kind==='stock'){
        return `
        <div class="mm-ticket-row">
          <span>📦 ${escapeHtml(item.name)} × ${item.qty}</span>
          <span style="display:flex;gap:8px;align-items:center;">
            <span class="mm-adj"><button data-stockcart-step="${item.key}|-1">−</button><button data-stockcart-step="${item.key}|1">+</button></span>
            <span>฿${baht(item.price)}</span>
          </span>
        </div>`;
      }
      const toppingChips = item.kind==='set' ? '' : state.toppings.map(t=>{
        const on = item.toppingIds.includes(t.id);
        return `<span class="mm-cat-chip ${on?'active':''}" data-toggle-topping="${item.key}|${t.id}">${escapeHtml(t.name)} +${baht(t.price)}</span>`;
      }).join('');
      return `
        <div class="mm-ticket-row" style="flex-direction:column;align-items:stretch;gap:6px;">
          <div style="display:flex;justify-content:space-between;">
            <span>${escapeHtml(item.name)}</span>
            <span style="display:flex;gap:10px;align-items:center;">
              <span>฿${baht(item.price)}</span>
              <button class="mm-del" data-remove-cart="${item.key}">✕</button>
            </span>
          </div>
          ${toppingChips?'<div class="mm-cat-toggle" style="margin-bottom:0;">'+toppingChips+'</div>':''}
        </div>`;
    }).join('') || '<div class="mm-empty" style="padding:14px 0;">แตะเมนูด้านบนเพื่อเริ่มออเดอร์</div>';

    return `
      <div class="mm-section-title">เลือกรสมาม่า</div>
      <div class="mm-grid">${menuTiles}</div>
      ${setTiles?'<div class="mm-section-title">เซตเมนู</div><div class="mm-grid">'+setTiles+'</div>':''}
      ${packTiles?'<div class="mm-section-title">หยิบเอง (แพ็ก/ห่อ) — จิ้มตามจำนวนที่ลูกค้าหยิบ</div><div class="mm-grid">'+packTiles+'</div>':''}
      <div class="mm-free-note">✓ ผักสดฟรี · น้ำเปล่าฟรี ทุกออเดอร์</div>

      <div class="mm-ticket">
        <div class="mm-ticket-title">ออเดอร์นี้</div>
        ${cartHtml}
        <div class="mm-ticket-total"><span>รวม</span><span>฿${baht(cartTotal())}</span></div>
        <button class="mm-checkout" ${state.cart.length===0?'disabled':''} id="mm-checkout-btn">บันทึกออเดอร์</button>
        ${state.cart.length>0?'<button class="mm-clear" id="mm-clear-btn">ล้างออเดอร์</button>':''}
      </div>
    `;
  }

  // ---------- COSTS ----------
  function daysInMonth(dt){ return new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate(); }
  async function deleteCost(id){ state.costs = state.costs.filter(c=>c.id!==id); await save('costs', state.costs); render(); }
  async function addCost(name, category, amount, frequency, date){
    name = cleanStr(name);
    const amountN = posNum(amount, null);
    if(!name || amountN===null || amountN<=0){ toast('กรุณากรอกชื่อและจำนวนเงินที่มากกว่า 0'); return; }
    state.costs.push({id:uid(), name, category, amount:amountN, frequency, date: date||null});
    await save('costs', state.costs); render(); toast('เพิ่มรายการต้นทุนแล้ว');
  }
  async function saveSettingsField(patch){
    state.settings = {...state.settings, ...patch};
    await save('settings', state.settings);
  }

  function computeMonthlyFixedCosts(now){
    const dim = daysInMonth(now);
    let total = 0; const breakdown = {};
    state.costs.forEach(c=>{
      let monthly = 0;
      if(c.frequency==='รายเดือน') monthly = c.amount;
      else if(c.frequency==='รายวัน') monthly = c.amount*dim;
      else if(c.frequency==='ครั้งเดียว' && c.date){
        const d = new Date(c.date);
        if(d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth()) monthly = c.amount;
      }
      total += monthly;
      breakdown[c.category] = (breakdown[c.category]||0) + monthly;
    });
    return {total, breakdown};
  }

  function renderCosts(){
    const cats = ['ทั้งหมด', ...CATEGORIES];
    const chips = cats.map(c=>`<span class="mm-cat-chip ${state.costCatFilter===c?'active':''}" data-cost-filter="${c}">${c}</span>`).join('');
    const filtered = state.costs.filter(c=>state.costCatFilter==='ทั้งหมด'||c.category===state.costCatFilter);
    const items = filtered.map(c=>`
      <div class="mm-list-item">
        <div><div class="mm-li-main">${escapeHtml(c.name)}</div><div class="mm-li-sub">${escapeHtml(c.category)} · ${escapeHtml(c.frequency)}${c.date?(' · '+c.date):''}</div></div>
        <div style="display:flex;align-items:center;gap:6px;"><div class="mm-li-amount">฿${baht(c.amount)}</div><button class="mm-del" data-del-cost="${c.id}">✕</button></div>
      </div>`).join('') || '<div class="mm-empty">ไม่มีรายการในหมวดนี้</div>';

    const now = new Date();
    const fixed = computeMonthlyFixedCosts(now);
    const bowls = state.settings.estimatedBowlsPerMonth || 1;
    const hiddenPerBowl = fixed.total / bowls;

    return `
      <div class="mm-section-title">รายการต้นทุน & ค่าใช้จ่าย</div>
      <div class="mm-cat-toggle">${chips}</div>
      ${items}

      <div class="mm-section-title">เพิ่มรายการใหม่</div>
      <div class="mm-form">
        <div class="mm-form-row"><div class="mm-field"><label>ชื่อรายการ</label><input id="cf-name" placeholder="เช่น ค่าภาษีป้าย"/></div></div>
        <div class="mm-form-row">
          <div class="mm-field"><label>หมวด</label><select id="cf-cat">${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
          <div class="mm-field"><label>ความถี่</label><select id="cf-freq"><option value="รายเดือน">รายเดือน</option><option value="รายวัน">รายวัน</option><option value="ครั้งเดียว">ครั้งเดียว</option></select></div>
        </div>
        <div class="mm-form-row">
          <div class="mm-field"><label>จำนวนเงิน (บาท)</label><input id="cf-amount" type="number" placeholder="0"/></div>
          <div class="mm-field" id="cf-date-wrap" style="display:none;"><label>วันที่ (สำหรับครั้งเดียว)</label><input id="cf-date" type="date"/></div>
        </div>
        <button class="mm-add-btn" id="mm-add-cost-btn">+ เพิ่มรายการต้นทุน</button>
      </div>

      <div class="mm-section-title">ต้นทุนแฝงต่อชาม (ประมาณการ)</div>
      <div class="mm-form">
        <div class="mm-form-row">
          <div class="mm-field"><label>คาดว่าขายได้กี่ชาม/เดือน</label><input id="cf-bowls" type="number" value="${state.settings.estimatedBowlsPerMonth}"/></div>
        </div>
        <div class="mm-hint" style="margin:6px 2px 0;">ต้นทุนคงที่รวม ฿${baht(fixed.total)} ÷ ${bowls} ชาม = <b style="color:var(--scallion)">฿${hiddenPerBowl.toFixed(1)}/ชาม</b> เป็นต้นทุนแฝง (ค่าเช่า ค่าแรง ค่าน้ำค่าไฟ) ที่ควรบวกเข้าไปในการตั้งราคาแต่ละชาม นอกเหนือจากต้นทุนวัตถุดิบ</div>
      </div>

      <div class="mm-section-title">ต้นทุนของฟรี (ผัก + น้ำเปล่า)</div>
      <div class="mm-form">
        <div class="mm-form-row"><div class="mm-field"><label>ต้นทุนของฟรีโดยเฉลี่ยต่อออเดอร์ (บาท)</label><input id="cf-freecost" type="number" value="${state.settings.freeCostPerOrder}"/></div></div>

  // ---------- DASHBOARD ----------
  function groupOrdersByDay(){
    const map = {};
    state.orders.forEach(o=>{
      const d = new Date(o.time);
      const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(!map[key]) map[key] = {count:0, total:0, dateObj:new Date(d.getFullYear(), d.getMonth(), d.getDate())};
      map[key].count++; map[key].total += o.total;
    });
    return Object.entries(map).sort((a,b)=>b[0].localeCompare(a[0]));
  }
  function groupOrdersByMonth(){
    const map = {};
    state.orders.forEach(o=>{
      const d = new Date(o.time);
      const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      if(!map[key]) map[key] = {count:0, total:0, dateObj:new Date(d.getFullYear(), d.getMonth(), 1)};
      map[key].count++; map[key].total += o.total;
    });
    return Object.entries(map).sort((a,b)=>b[0].localeCompare(a[0]));
  }
  function computeRevenue(now, todayOnly){
    let total=0, count=0; const todayStr = now.toDateString();
    state.orders.forEach(o=>{
      const d = new Date(o.time);
      if(todayOnly){ if(d.toDateString()===todayStr){ total+=o.total; count++; } }
      else { if(d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth()){ total+=o.total; count++; } }
    });
    return {total, count};
  }
  // Direct ingredient cost (COGS) + stock usage for one order, using current stock cost/linkage
  function orderStockUsageAndCogs(order){
    let cogs = 0; const usage = {};
    (order.items||[]).forEach(it=>{
      if(it.refKind==='menu'){
        const m = state.menu.find(x=>x.id===it.refId);
        if(m && m.stockId && m.useQty){
          usage[m.stockId] = (usage[m.stockId]||0) + m.useQty;
          const s = state.stock.find(x=>x.id===m.stockId);
          if(s) cogs += m.useQty * s.costPerUnit;
        }
      } else if(it.refKind==='stock'){
        const s = state.stock.find(x=>x.id===it.refId);
        const qty = it.qty||1;
        if(s){ usage[it.refId] = (usage[it.refId]||0) + qty; cogs += qty * s.costPerUnit; }
      }
      (it.toppingIds||[]).forEach(tid=>{
        const t = state.toppings.find(x=>x.id===tid);
        if(t && t.stockId && t.useQty){
          usage[t.stockId] = (usage[t.stockId]||0) + t.useQty;
          const s = state.stock.find(x=>x.id===t.stockId);
          if(s) cogs += t.useQty * s.costPerUnit;
        }
      });
    });
    return {usage, cogs};
  }
  function computeCogsForOrders(orders){
    let cogs = 0;
    orders.forEach(o=>{ cogs += orderStockUsageAndCogs(o).cogs; });
    return cogs;
  }
  function computeStockDemandForecast(days){
    days = days || 14;
    const cutoff = Date.now() - days*24*60*60*1000;
    const usageTotals = {};
    state.orders.forEach(o=>{
      if(new Date(o.time).getTime() < cutoff) return;
      const {usage} = orderStockUsageAndCogs(o);
      Object.entries(usage).forEach(([sid,qty])=>{ usageTotals[sid] = (usageTotals[sid]||0) + qty; });
    });
    return state.stock.map(s=>{
      const totalUsed = usageTotals[s.id] || 0;
      const avgDaily = totalUsed / days;
      const daysRemaining = avgDaily>0 ? s.qty/avgDaily : Infinity;
      const reorderPoint = avgDaily * 3;
      const suggestedQty = Math.ceil(avgDaily*7);
      return {stock:s, avgDaily, daysRemaining, reorderPoint, suggestedQty, needsReorder: avgDaily>0 && s.qty<=reorderPoint};
    }).filter(r=>r.avgDaily>0).sort((a,b)=>a.daysRemaining-b.daysRemaining);
  }
  function bestWorstSellers(){
    const menuCount = {}, topCount = {};
    state.orders.forEach(o=>o.items.forEach(it=>{
      if(it.refKind!=='set'){ menuCount[it.name] = (menuCount[it.name]||0)+1; }
      (it.toppings||[]).forEach(tn=>{ if(tn) topCount[tn] = (topCount[tn]||0)+1; });
    }));
    return {menuCount, topCount};
  }
  function exportCsv(){
    const now = new Date();
    let rows = [['ประเภท','ชื่อรายการ','หมวด/รายละเอียด','จำนวนเงิน','วันที่/ความถี่','พนักงาน']];
    state.costs.forEach(c=>rows.push(['ต้นทุน', c.name, c.category, c.amount, c.frequency + (c.date?(' '+c.date):''), '']));
    state.waste.forEach(w=>rows.push(['ของเสีย', w.name, w.reason, w.cost, new Date(w.date).toLocaleDateString('th-TH'), '']));
    state.orders.forEach(o=>rows.push(['ยอดขาย', o.items.map(i=>i.name).join('+'), '', o.total, new Date(o.time).toLocaleString('th-TH'), o.cashierName||'']));
    const csv = rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `makin-mama-${now.getFullYear()}-${now.getMonth()+1}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('ส่งออก CSV แล้ว');
  }

    const totalCosts = fixed.total + freeCostTotal;

    const todayCogs = computeCogsForOrders(todayOrders);
    const monthCogs = computeCogsForOrders(monthOrders);
    const todayGrossProfit = today.total - todayCogs;
    const monthGrossProfit = month.total - monthCogs;
    const todayMargin = today.total>0 ? (todayGrossProfit/today.total*100) : 0;
    const monthMargin = month.total>0 ? (monthGrossProfit/month.total*100) : 0;

      </div>
      <div class="mm-stat-grid" style="margin-top:8px;">
        <div class="mm-stat"><div class="mm-stat-label">กำไรเฉลี่ยต่อบิลวันนี้</div><div class="mm-stat-value">฿${avgProfitPerBillToday.toFixed(1)}</div></div>
        <div class="mm-stat"><div class="mm-stat-label">กำไรเฉลี่ยต่อบิลเดือนนี้</div><div class="mm-stat-value">฿${avgProfitPerBillMonth.toFixed(1)}</div></div>
      </div>

      <div class="mm-section-title">พยากรณ์ความต้องการวัตถุดิบ (Demand Forecasting)</div>
      <div class="mm-hint">ใช้ค่าเฉลี่ยการใช้วัตถุดิบย้อนหลัง 14 วัน ประมาณวันที่จะหมดและจุดที่ควรสั่งซื้อซ้ำ (reorder point = ใช้เฉลี่ย/วัน × 3 วันสำรอง)</div>
      ${forecastHtml}

      ${lowStock.length? '<div class="mm-banner">⚠ วัตถุดิบใกล้หมด: '+lowStock.map(s=>escapeHtml(s.name)).join(', ')+'</div>' : ''}

      <div class="mm-section-title">เมนูขายดี</div>
      ${rankHtml(menuRanked.slice(0,5))}
      <div class="mm-section-title">เมนูขายน้อย (ควรลดสต๊อก)</div>
      ${rankHtml(menuRanked.slice().reverse().slice(0,5))}
      <div class="mm-section-title">ท็อปปิ้งยอดนิยม</div>
      ${rankHtml(topRanked.slice(0,5))}

      <div class="mm-section-title">ต้นทุนแยกตามหมวด (ต่อเดือน)</div>
      ${barsHtml}

      <div class="mm-section-title">สรุปยอดรายวัน</div>
      ${dailyHtml}

      <div class="mm-section-title">สรุปยอดรายเดือน</div>
      ${monthlyHtml}

      <button class="mm-export-btn" id="mm-export-btn">⤓ ส่งออกข้อมูลเป็น CSV</button>
      <div class="mm-sheets-note">เมื่อเชื่อมต่อ Google Sheets ในอนาคต ตัวเลขในหน้านี้จะดึงจากชีตอัตโนมัติ ตอนนี้ข้อมูลทั้งหมดถูกเก็บไว้ในเครื่องนี้และพร้อมส่งออกเป็น CSV ได้ตลอดเวลา</div>
    `;
  }

  // ---------- SETTINGS ----------
  function renderSettings(){
    const staffList = state.staff.map(s=>`
      <div class="mm-list-item">
        <div><div class="mm-li-main">${escapeHtml(s.name)}</div>${s.code?'<div class="mm-li-sub">รหัส '+escapeHtml(s.code)+'</div>':''}</div>
        <button class="mm-del" data-del-staff="${s.id}">✕</button>
      </div>`).join('') || '<div class="mm-empty">ยังไม่มีรายชื่อพนักงาน</div>';

    return `
      <div class="mm-section-title">รายชื่อพนักงาน (สำหรับหน้าล็อกอิน)</div>
      ${staffList}
      <div class="mm-form">
        <div class="mm-form-row">
          <div class="mm-field"><label>ชื่อพนักงาน</label><input id="stf-name" placeholder="ชื่อจริง"/></div>
          <div class="mm-field" style="max-width:100px;"><label>รหัส (ไม่บังคับ)</label><input id="stf-code" placeholder="เช่น 001"/></div>
        </div>
        <button class="mm-add-btn" id="mm-add-staff-btn">+ เพิ่มพนักงาน</button>
      </div>
      <div class="mm-hint">รายชื่อนี้จะขึ้นเป็นปุ่มให้เลือกในหน้าล็อกอินตอนเปิดแอป</div>

      <div class="mm-section-title">ล็อกหน้าจอข้อมูลการเงิน</div>
      <div class="mm-form">
        <div class="mm-form-row"><div class="mm-field"><label>ตั้ง PIN 4-6 หลัก (เว้นว่าง = ไม่ล็อก)</label><input id="set-pin" type="password" inputmode="numeric" maxlength="6" value="${escapeHtml(state.settings.ownerPin)}" placeholder="เช่น 1234"/></div></div>
        <button class="mm-add-btn" id="mm-save-pin-btn">บันทึก PIN</button>
      </div>
      <div class="mm-hint">PIN นี้จะล็อกแท็บ "ต้นทุน" และ "สรุปยอด" ไว้ ป้องกันพนักงานเปิดดูตัวเลขกำไร/ขาดทุนโดยไม่ได้ตั้งใจ — เป็นการล็อกหน้าจอในเครื่องนี้เท่านั้น ไม่ใช่ระบบล็อกอินที่ปลอดภัยระดับองค์กร</div>

      <div class="mm-section-title">ข้อมูลร้าน</div>
      <div class="mm-hint">มากิน มาม่า — ร้านมาม่าต้มเองแบบ DIY หน้าโรงเรียนมงฟอร์ตประถม เชียงใหม่ · เมนูไม่มีหมูทุกรายการ</div>
    `;
  }

  function render(){
    const tabsEl = document.getElementById('mm-tabs');
    const bodyEl = document.getElementById('mm-body');
    const userBadge = document.getElementById('mm-user-badge');
    if(!state.loaded){ tabsEl.innerHTML=''; bodyEl.innerHTML = '<div class="mm-empty">กำลังโหลด...</div>'; if(userBadge) userBadge.innerHTML=''; return; }
    if(!state.currentUser){
      tabsEl.innerHTML = '';
      bodyEl.innerHTML = renderLogin();
      if(userBadge) userBadge.innerHTML = '';
      bindEvents();
      return;
    }
    if(userBadge) userBadge.innerHTML = `<span class="mm-user-name">👤 ${escapeHtml(state.currentUser.name)}</span><button id="mm-logout-btn" class="mm-logout-btn">ออกจากระบบ</button>`;
    tabsEl.innerHTML = TABS.map(t=>`<button class="mm-tabbtn ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
    if(state.tab==='pos') bodyEl.innerHTML = renderPOS();
    else if(state.tab==='stock') bodyEl.innerHTML = renderStock();
    else if(state.tab==='costs') bodyEl.innerHTML = renderCosts();
    else if(state.tab==='menu') bodyEl.innerHTML = renderMenu();
    else if(state.tab==='dash') bodyEl.innerHTML = renderDash();
    else if(state.tab==='settings') bodyEl.innerHTML = renderSettings();
    bindEvents();
  }

  function bindEvents(){
    document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>setTab(el.dataset.tab)));

    // Login / logout
    document.querySelectorAll('[data-login-as]').forEach(el=>el.addEventListener('click',()=>loginAs(el.dataset.loginAs)));
    const loginInput = document.getElementById('login-input');
    if(loginInput) loginInput.addEventListener('input', ()=>{ state.loginInput = loginInput.value; });
    const loginBtn = document.getElementById('mm-login-btn');
    if(loginBtn) loginBtn.addEventListener('click', loginSubmit);
    const logoutBtn = document.getElementById('mm-logout-btn');
    if(logoutBtn) logoutBtn.addEventListener('click', logout);

    // POS
    document.querySelectorAll('[data-add-bowl]').forEach(el=>el.addEventListener('click',()=>{ const m=state.menu.find(x=>x.id===el.dataset.addBowl); if(m) addBowl(m); }));
    document.querySelectorAll('[data-add-set]').forEach(el=>el.addEventListener('click',()=>{ const s=state.setMenus.find(x=>x.id===el.dataset.addSet); if(s) addSet(s); }));
    document.querySelectorAll('[data-add-pack]').forEach(el=>el.addEventListener('click',()=>{ const s=state.stock.find(x=>x.id===el.dataset.addPack); if(s) addStockPack(s); }));
    document.querySelectorAll('[data-stockcart-step]').forEach(el=>el.addEventListener('click',()=>{ const [key,d]=el.dataset.stockcartStep.split('|'); stepStockCartQty(key, Number(d)); }));
    document.querySelectorAll('[data-toggle-topping]').forEach(el=>el.addEventListener('click',()=>{
      const [key,tid] = el.dataset.toggleTopping.split('|');
      const t = state.toppings.find(x=>x.id===tid); if(t) toggleTopping(key, t);
    }));
    document.querySelectorAll('[data-remove-cart]').forEach(el=>el.addEventListener('click',()=>removeCartItem(el.dataset.removeCart)));
    const checkoutBtn = document.getElementById('mm-checkout-btn');
    if(checkoutBtn) checkoutBtn.addEventListener('click', checkout);
    const clearBtn = document.getElementById('mm-clear-btn');
    if(clearBtn) clearBtn.addEventListener('click', ()=>{state.cart=[]; render();});

    // Stock & waste
    document.querySelectorAll('[data-stock-adj]').forEach(el=>el.addEventListener('click',()=>{ const [id,d]=el.dataset.stockAdj.split('|'); adjustStock(id, Number(d)); }));
    document.querySelectorAll('[data-del-stock]').forEach(el=>el.addEventListener('click',()=>deleteStock(el.dataset.delStock)));
    document.querySelectorAll('[data-del-waste]').forEach(el=>el.addEventListener('click',()=>deleteWaste(el.dataset.delWaste)));
    document.querySelectorAll('[data-del-inbound]').forEach(el=>el.addEventListener('click',()=>deleteInboundRecord(el.dataset.delInbound)));
    const sellDirectCk = document.getElementById('st-selldirect');
    if(sellDirectCk) sellDirectCk.addEventListener('change', ()=>{
      document.getElementById('st-sellprice-wrap').style.display = sellDirectCk.checked ? '' : 'none';
    });
    const addStockBtn = document.getElementById('mm-add-stock-btn');
    if(addStockBtn) addStockBtn.addEventListener('click', ()=>addStock(
      document.getElementById('st-name').value.trim(), document.getElementById('st-unit').value.trim(),
      document.getElementById('st-qty').value, document.getElementById('st-low').value, document.getElementById('st-cost').value,
      document.getElementById('st-selldirect').checked, document.getElementById('st-sellprice').value));
    const receiveStockBtn = document.getElementById('mm-receive-stock-btn');
    if(receiveStockBtn) receiveStockBtn.addEventListener('click', ()=>receiveStock(
      document.getElementById('rc-stock').value, document.getElementById('rc-qty').value, document.getElementById('rc-cost').value));
    const addWasteBtn = document.getElementById('mm-add-waste-btn');
    if(addWasteBtn) addWasteBtn.addEventListener('click', ()=>addWaste(
      document.getElementById('ws-stock').value, document.getElementById('ws-qty').value, document.getElementById('ws-reason').value.trim()));


    // Costs
    document.querySelectorAll('[data-cost-filter]').forEach(el=>el.addEventListener('click',()=>{ state.costCatFilter = el.dataset.costFilter; render(); }));
    document.querySelectorAll('[data-del-cost]').forEach(el=>el.addEventListener('click',()=>deleteCost(el.dataset.delCost)));
    const freqSel = document.getElementById('cf-freq');
    if(freqSel) freqSel.addEventListener('change', ()=>{ document.getElementById('cf-date-wrap').style.display = freqSel.value==='ครั้งเดียว' ? '' : 'none'; });
    const addCostBtn = document.getElementById('mm-add-cost-btn');
    if(addCostBtn) addCostBtn.addEventListener('click', ()=>addCost(
      document.getElementById('cf-name').value.trim(), document.getElementById('cf-cat').value, document.getElementById('cf-amount').value,
      document.getElementById('cf-freq').value, document.getElementById('cf-date')?document.getElementById('cf-date').value:null));
    const bowlsInput = document.getElementById('cf-bowls');
    if(bowlsInput) bowlsInput.addEventListener('change', ()=>saveSettingsField({estimatedBowlsPerMonth:Number(bowlsInput.value)||0}).then(render));
    const freeCostInput = document.getElementById('cf-freecost');
    if(freeCostInput) freeCostInput.addEventListener('change', ()=>saveSettingsField({freeCostPerOrder:Number(freeCostInput.value)||0}).then(render));

    // Menu settings
    document.querySelectorAll('[data-del-menu]').forEach(el=>el.addEventListener('click',()=>deleteMenuItem(el.dataset.delMenu)));
    document.querySelectorAll('[data-del-topping]').forEach(el=>el.addEventListener('click',()=>deleteTopping(el.dataset.delTopping)));
    document.querySelectorAll('[data-del-setmenu]').forEach(el=>el.addEventListener('click',()=>deleteSetMenu(el.dataset.delSetmenu)));
    const addMenuBtn = document.getElementById('mm-add-menu-btn');
    if(addMenuBtn) addMenuBtn.addEventListener('click', ()=>addMenuItem(
      document.getElementById('mf-name').value.trim(), document.getElementById('mf-price').value,
      document.getElementById('mf-stock').value, document.getElementById('mf-useqty').value));
    const addToppingBtn = document.getElementById('mm-add-topping-btn');
    if(addToppingBtn) addToppingBtn.addEventListener('click', ()=>addTopping(
      document.getElementById('tf-name').value.trim(), document.getElementById('tf-price').value,
      document.getElementById('tf-stock').value, document.getElementById('tf-useqty').value));
    const addSetBtn = document.getElementById('mm-add-setmenu-btn');
    if(addSetBtn) addSetBtn.addEventListener('click', ()=>addSetMenu(document.getElementById('sf-name').value.trim(), document.getElementById('sf-price').value));

    // Dashboard
    const exportBtn = document.getElementById('mm-export-btn');
    if(exportBtn) exportBtn.addEventListener('click', exportCsv);
    const pinInput = document.getElementById('mm-pin-input');
    if(pinInput) pinInput.addEventListener('input', ()=>{ state.pinInput = pinInput.value; });
    const pinSubmit = document.getElementById('mm-pin-submit');
    if(pinSubmit) pinSubmit.addEventListener('click', ()=>{
      if(state.pinInput === state.settings.ownerPin){ state.unlocked = true; state.pinInput=''; render(); }
      else { toast('PIN ไม่ถูกต้อง'); }
    });
    const relockBtn = document.getElementById('mm-relock-btn');
    if(relockBtn) relockBtn.addEventListener('click', ()=>{ state.unlocked = false; render(); });
    const refreshNowBtn = document.getElementById('mm-refresh-now-btn');
    if(refreshNowBtn) refreshNowBtn.addEventListener('click', refreshData);

    // Settings
    document.querySelectorAll('[data-del-staff]').forEach(el=>el.addEventListener('click',()=>deleteStaff(el.dataset.delStaff)));
    const addStaffBtn = document.getElementById('mm-add-staff-btn');
    if(addStaffBtn) addStaffBtn.addEventListener('click', ()=>addStaff(document.getElementById('stf-name').value.trim(), document.getElementById('stf-code').value.trim()));
    const savePinBtn = document.getElementById('mm-save-pin-btn');
    if(savePinBtn) savePinBtn.addEventListener('click', ()=>{
      const pin = document.getElementById('set-pin').value.trim();
      saveSettingsField({ownerPin: pin}).then(()=>{ state.unlocked=false; toast('บันทึก PIN แล้ว'); render(); });
    });
  }

  load();
})();
</script>

</body>
</html>
