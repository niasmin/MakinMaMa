<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>มากิน มาม่า — ระบบสต๊อก</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="mm-sync.js"></script>
<style>
:root{--bg:#FFFBEA;--panel:#fff;--ink:#3A2400;--soft:#8A7A4E;--red:#C41E2A;--red-d:#8F1420;--red-s:#FCE9C8;--gold:#C6791E;--gold-s:#FBEBD3;--green:#2F9E52;--green-s:#E3F5E9;--line:#F3E6BE;--top:#FFCB05;--top-ink:#7A0000;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.k{font-family:'Kanit',sans-serif}
header{background:var(--top);color:var(--top-ink);border-bottom:3px solid var(--red);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{width:38px;height:38px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--red)}
.brand{font-family:'Kanit';font-weight:700;font-size:18px;flex:1;min-width:150px}
.badge{font-size:12px;padding:4px 10px;border-radius:999px;background:#fff;color:var(--soft);font-weight:600}
.badge.on{background:var(--green-s);color:var(--green)}
.userbtn{background:rgba(255,255,255,.6);border:none;border-radius:999px;padding:5px 12px;font-family:'Sarabun';font-size:12.5px;cursor:pointer;color:var(--top-ink)}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;position:sticky;top:0;z-index:5}
nav button{background:none;border:none;border-bottom:3px solid transparent;padding:12px 12px 9px;font-family:'Kanit';font-size:14px;color:var(--soft);cursor:pointer;white-space:nowrap;font-weight:500}
nav button.on{color:var(--red);border-bottom-color:var(--red)}
main{max-width:980px;margin:0 auto;padding:16px 14px 90px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px}
.stat .n{font-family:'Kanit';font-weight:700;font-size:21px;color:var(--red-d)}
.stat .l{font-size:12.5px;color:var(--soft)}
.stat.warn .n{color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.f{flex:1;min-width:120px}
.f label{display:block;font-size:12px;color:var(--soft);margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;font-family:'Sarabun';font-size:14px;background:#fff;color:var(--ink)}
button.p{background:var(--red);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-family:'Kanit';font-weight:600;font-size:14px;cursor:pointer}
button.s{background:#fff;color:var(--red-d);border:1.5px solid var(--red-s);border-radius:10px;padding:9px 14px;font-family:'Kanit';font-size:13px;cursor:pointer}
button.g{background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-family:'Kanit';font-weight:600;cursor:pointer}
button.x{background:none;border:none;color:#C9A6A6;cursor:pointer;font-size:16px}
.types{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.types button{flex:1;min-width:90px;padding:9px 4px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-family:'Kanit';font-size:13.5px;cursor:pointer;color:var(--soft)}
.types button.on{background:var(--red);border-color:var(--red);color:#fff}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--red-s);color:var(--red-d);font-family:'Kanit';font-size:12.5px;text-align:left;padding:8px 10px;white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}
td input{width:90px;padding:6px 8px}
.num{text-align:right}
.tag{display:inline-block;font-family:'Kanit';font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px}
.t-in{background:var(--green-s);color:var(--green)}.t-out{background:var(--red-s);color:var(--red-d)}.t-waste{background:#FFE0DD;color:var(--red)}.t-adjust{background:var(--gold-s);color:var(--gold)}
.low{color:var(--gold);font-weight:700}
.note{font-size:12.5px;color:var(--soft);line-height:1.6}
.empty{text-align:center;color:var(--soft);padding:22px 0;font-size:14px}
.banner{background:#FFF3C4;border:1.5px solid var(--gold);color:#7A5100;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;line-height:1.6}
.err{color:var(--red-d);font-size:13px;margin:6px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.item-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.item-row:first-of-type{border-top:none}
.item-row .nm{flex:1;min-width:140px;font-weight:600}
.code{font-family:'Kanit';font-size:11.5px;color:var(--soft);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.rep{min-width:1350px}
.rep th,.rep td{padding:6px 8px;font-size:12.5px}
main.wide{max-width:1500px}
.rep th{text-align:center;white-space:normal;vertical-align:bottom;line-height:1.3}
.rep tr.cat td{background:var(--gold-s);font-family:'Kanit';font-weight:600;color:var(--gold)}
.rep tr.tot td{font-family:'Kanit';font-weight:700;border-top:2px solid var(--red-s)}
.rep td.buy{color:var(--green)}
.warn-c{color:var(--red);font-weight:600}
.brand{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button .ic{margin-right:4px}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.qa button{border:none;border-radius:14px;padding:16px 8px;font-family:'Kanit';font-size:15px;font-weight:600;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px}
.qa .ic{font-size:26px}
.q-in{background:var(--green)}.q-out{background:var(--red)}.q-waste{background:#B3541E}.q-count{background:var(--gold)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.chips button{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-family:'Kanit';font-size:13px;color:var(--soft);cursor:pointer}
.chips button.on{background:var(--red);border-color:var(--red);color:#fff}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;max-height:330px;overflow:auto;padding:2px}
.pick button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;cursor:pointer;font-family:'Sarabun';font-size:14px;color:var(--ink);min-height:58px;line-height:1.35}
.pick button.sel{border-color:var(--green);background:var(--green-s)}
.pick .q{display:block;font-size:12px;color:var(--soft)}.pick .q.low{color:var(--gold);font-weight:600}
.line{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.line .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.line .bd{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:20px;cursor:pointer;color:var(--red-d);font-family:'Kanit'}
.step input{width:84px;text-align:center}
.pm{display:flex;gap:4px;margin-bottom:3px}.pm button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 8px;font-size:11.5px;color:var(--soft);cursor:pointer}.pm button.on{background:var(--gold-s);color:var(--gold);border-color:var(--gold)}
.after{font-size:12.5px;color:var(--soft);margin-top:6px}.after b{color:var(--ink)}.after.bad{color:var(--red)}
.bar{position:sticky;bottom:0;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;justify-content:space-between;box-shadow:0 -4px 14px rgba(0,0,0,.06);margin-top:10px;z-index:4}
.cnt-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.cnt-row .nm{flex:1;min-width:0}.cnt-row input{width:92px;text-align:center}
.diff{min-width:70px;text-align:right;font-family:'Kanit';font-size:13px;color:var(--soft)}.diff.minus{color:var(--red)}.diff.plus{color:var(--green)}
.rcard{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.rcard .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;text-align:center}
.flow div{background:var(--bg);border-radius:8px;padding:5px 2px;font-size:11.5px;color:var(--soft)}.flow b{display:block;font-family:'Kanit';font-size:15px;color:var(--ink)}
.seg{display:flex;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:9px;font-family:'Kanit';font-size:14px;color:var(--soft);cursor:pointer}.seg button.on{background:#fff;color:var(--red-d);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.shop{background:var(--green-s);border:1.5px solid #BFE5CB;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.shop li{margin:3px 0}
@media(min-width:701px){.qa{grid-template-columns:repeat(4,1fr)}.mob{display:none!important}}
@media(max-width:700px){
  header{padding:8px 12px;gap:8px;flex-wrap:nowrap}
  header img{width:32px;height:32px}
  .brand{font-size:15px;min-width:0}
  .badge{font-size:11px;padding:3px 8px;white-space:nowrap}
  .userbtn{padding:4px 9px;font-size:11.5px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  nav{position:fixed;bottom:0;left:0;right:0;top:auto;border-top:1px solid var(--line);border-bottom:none;padding:0 0 env(safe-area-inset-bottom);gap:0;box-shadow:0 -2px 12px rgba(0,0,0,.07);overflow:visible}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;font-size:10.5px;border-bottom:none;border-top:3px solid transparent;min-width:0}
  nav button.on{border-top-color:var(--red)}
  nav button .ic{font-size:20px;margin:0}
  main{padding:12px 12px 96px}
  input,select,textarea{font-size:16px}
  .toast{bottom:86px}
  .desk{display:none!important}
  .bar{bottom:70px}
}
@media print{
  header,nav,.noprint,.toast,.mob{display:none!important}
  .desk{display:block!important}
  body{background:#fff}
  main{max-width:none;padding:0}
  .card{border:none;padding:0}
  .scroll{overflow:visible}
  .rep th,.rep td{font-size:10px;padding:3px 4px;border:1px solid #ccc}
  @page{size:A4 landscape;margin:8mm}
}
</style>
</head>

<script>
/* ================= helpers & storage ================= */
const LS='mmst_';
const ld=(k,d)=>{try{const r=localStorage.getItem(LS+k);return r===null?d:JSON.parse(r)}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(LS+k,JSON.stringify(v));return true}catch(e){toast('บันทึกในเครื่องไม่สำเร็จ (พื้นที่เต็มหรือถูกบล็อก)');return false}};
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=(n,d=2)=>Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:d});
const baht=n=>'฿'+fmt(n,2);
const r4=n=>Math.round(n*10000)/10000;
const r2=n=>Math.round(n*100)/100;
const dt=iso=>new Date(iso).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const dd=iso=>new Date(iso).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
const TL={in:'รับเข้า',out:'เบิกใช้',waste:'ของเสีย',adjust:'ปรับยอด/นับ'};

const S={items:[],moves:[],periods:[],tab:'dash',user:ld('user',''),sync:{state:'off',pending:0,error:''},last:null,wizard:null,draft:{},viewPeriod:null,moveType:'in',batch:[],pickQ:'',pickCat:'',itemQ:'',itemCat:'',showForm:false,cntQ:'',cntCat:'',repMode:'month',repFilter:'',countDraft:ld('countDraft',{})};

const SEED_CAT=n=>/มาม่า/.test(n)?['เส้น/มาม่า','ชั้นของแห้ง']:/ไข่|ผัก|เต้าหู้/.test(n)?['วัตถุดิบสด','ตู้เย็น']:/เนื้อ|ไก่|หมึก|กุ้ง|ปูอัด|ลูกชิ้น|ไส้กรอก|โบโลน่า|แฮม|ชีส|นักเกต|เฟรนช์/.test(n)?['เนื้อสัตว์/ของแช่แข็ง','ตู้แช่แข็ง']:/ซอส|สาหร่าย/.test(n)?['ซอส/เครื่องปรุง','ชั้นของแห้ง']:/น้ำ|ไอศกรีม/.test(n)?['เครื่องดื่ม/ของหวาน','ตู้เย็น']:['อื่นๆ','ชั้นของแห้ง'];
const SEED=[['มาม่าไทย','ซอง'],['มาม่าบิ๊กแพ็ค','ซอง'],['มาม่าเกาหลี','ซอง'],['ไข่ไก่','ฟอง'],['ผักสด','ชุด'],['ลูกชิ้นไก่','ลูก'],['ลูกชิ้นปลา','ลูก'],['ลูกชิ้นเนื้อ','ลูก'],['ไส้กรอกหนังกรอบ','ชิ้น'],['เต้าหู้','ชิ้น'],['เนื้อวัว','กรัม'],['ไก่สับ','กรัม'],['สาหร่ายวากาเมะ','ห่อ'],['โบโลน่า','ชิ้น'],['แฮมไก่','ชิ้น'],['ปูอัด','ชิ้น'],['ชีสแผ่น','แผ่น'],['ไก่ฉีก','กรัม'],['หนังไก่กรอบ','ชิ้น'],['ปลาหมึก','กรัม'],['กุ้ง','ตัว'],['นักเกต','ชิ้น'],['ชีสบอล','ชิ้น'],['เฟรนช์ฟราย','กรัม'],['ไก่ป๊อป','ชิ้น'],['ไก่ไร้กระดูก','ชิ้น'],['ซอสเกาหลี','มล.'],['ซอสเทอริยากิ','มล.'],['ข้าวสวย','ถ้วย'],['ไอศกรีมเนสเล่','ถ้วย'],['น้ำดื่ม','ขวด'],['น้ำแข็ง','กก.']];

/* ---- data layer: เก็บใน localStorage เสมอ ถ้าต่อ Supabase จะเขียนขึ้นรายรายการด้วย (กันเขียนทับกันระหว่างอุปกรณ์) ---- */
// ยอดคงเหลือ (qty) ส่งเป็นส่วนต่าง ตัด/รับพร้อมกันหลายเครื่องก็ไม่หาย, ของที่บันทึกตอนออฟไลน์จะถูกส่งขึ้นภายหลัง
const syncStore=MMSync.createStore({
  name:'stock',
  keys:{items:{list:true,coll:'stock_items',delta:['qty']},moves:{list:true,coll:'stock_moves'},periods:{list:true,coll:'stock_periods'}},
  get:k=>S[k], set:(k,v)=>{ S[k]=v; sv(k,v); },
  onData:()=>{ S.last=new Date(); refreshLive(); },
  onStatus:s=>{ const re=(S.sync.state==='off')!==(s.state==='off'); S.sync=s; if(re&&S.tab==='settings') renderTab(); else { renderHeader(); const el=$('#syncst'); if(el) el.innerHTML=syncLabel(); const er=$('#syncerr'); if(er) er.textContent=s.error?'⚠ '+s.error:''; } },
});
const syncOn=()=>S.sync.state!=='off';
function upsertLocal(k,o){ const i=S[k].findIndex(x=>x.id===o.id); i<0?S[k].push(o):S[k][i]=o; sv(k,S[k]); }
function putItem(it){ upsertLocal('items',it); afterChange(); syncStore.save(); }
function removeItem(id){ S.items=S.items.filter(x=>x.id!==id); sv('items',S.items); afterChange(); syncStore.save(); }
function putPeriod(p){ upsertLocal('periods',p); afterChange(); syncStore.save(); }
const openPeriod=()=>S.periods.find(p=>p.status==='open')||null;

function applyToItem(it,mv){
  const o={...it}, q=Number(mv.qty)||0;
  if(mv.type==='in'){ const nq=it.qty+q; o.avgCost=nq>0?r4(((it.qty*it.avgCost)+mv.totalCost)/nq):it.avgCost; o.qty=nq; return {item:o,delta:q,unitCost:q>0?r4(mv.totalCost/q):0,value:mv.totalCost}; }
  if(mv.type==='out'||mv.type==='waste'){ const use=Math.min(q,it.qty); o.qty=r4(it.qty-use); return {item:o,delta:-use,unitCost:it.avgCost,value:r4(use*it.avgCost)}; }
  const d=mv.setTo-it.qty; if(mv.setCost!=null) o.avgCost=mv.setCost; o.qty=mv.setTo; return {item:o,delta:r4(d),unitCost:o.avgCost,value:r4(d*o.avgCost)};
}
function commitMove(mv){
  const it=S.items.find(x=>x.id===mv.itemId); if(!it) return Promise.resolve(false);
  const op=openPeriod();
  Object.assign(mv,{id:uid(),time:new Date().toISOString(),by:S.user||'-',name:it.name,unit:it.unit,periodId:op?op.id:null});
  const local=()=>{
    const cur=S.items.find(x=>x.id===mv.itemId)||it, res=applyToItem(cur,mv); upsertLocal('items',res.item);
    Object.assign(mv,{delta:res.delta,unitCost:res.unitCost,value:res.value}); upsertLocal('moves',mv); afterChange(); syncStore.save();
    return true;
  };
  if(S.sync.state==='online' && !syncStore.isDirty('items',it.id)){
    // ออนไลน์: คำนวณจากค่าล่าสุดบนเซิร์ฟเวอร์แบบกันชนกัน (ต้นทุนเฉลี่ยแม่นยำแม้หลายเครื่องรับของพร้อมกัน)
    let res=null;
    return syncStore.mutate('items',it.id,cur=>{ res=applyToItem(cur,mv); return res.item; }).then(saved=>{
      if(saved===undefined||!res) return local(); // ยังไม่มีบนเซิร์ฟเวอร์ — บันทึกในเครื่องแล้วซิงก์ตามปกติ
      Object.assign(mv,{delta:res.delta,unitCost:res.unitCost,value:res.value}); upsertLocal('moves',mv); afterChange(); syncStore.save();
      return true;
    },()=>local()); // เน็ตหลุดระหว่างทาง — บันทึกในเครื่อง ยอดส่งเป็นส่วนต่างภายหลัง
  }
  return Promise.resolve(local());
}

/* ================= period maths ================= */
function calcSummary(p,counts){
  const rows=[]; let T={openVal:0,buy:0,closeVal:0,cogs:0,wasteVal:0,varVal:0};
  S.items.forEach(it=>{
    const op=p.opening[it.id]||{qty:0,cost:0};
    const mv=S.moves.filter(m=>m.periodId===p.id&&m.itemId===it.id);
    let inQ=0,inC=0,outQ=0,wasteQ=0,wasteV=0;
    mv.forEach(m=>{ if(m.type==='in'){inQ+=m.qty;inC+=m.value} else if(m.type==='out') outQ+=m.qty; else if(m.type==='waste'){wasteQ+=-m.delta;wasteV+=m.value} });
    const sys=it.qty, phys=counts&&counts[it.id]!=null?counts[it.id]:sys, cc=it.avgCost;
    if(!op.qty&&!inQ&&!outQ&&!wasteQ&&!sys&&!phys) return;
    const cogs=op.qty*op.cost+inC-phys*cc;
    const r={id:it.id,name:it.name,unit:it.unit,openQty:op.qty,openCost:op.cost,inQty:inQ,inCost:inC,outQty:outQ,wasteQty:wasteQ,sysQty:sys,physQty:phys,closeCost:cc,usedQty:r4(op.qty+inQ-phys),cogs:r4(cogs),varQty:r4(sys-phys),varVal:r4((sys-phys)*cc)};
    rows.push(r); T.openVal+=op.qty*op.cost; T.buy+=inC; T.closeVal+=phys*cc; T.cogs+=cogs; T.wasteVal+=wasteV; T.varVal+=r.varVal;
  });
  Object.keys(T).forEach(k=>T[k]=r4(T[k]));
  return {rows,totals:T};
}
function sumTable(sm){
  if(!sm.rows.length) return '<div class="empty">ไม่มีรายการเคลื่อนไหวในงวดนี้</div>';
  return `<div class="scroll"><table><thead><tr><th>วัตถุดิบ</th><th class="num">ต้นงวด</th><th class="num">รับเข้า</th><th class="num">ปลายงวด(นับ)</th><th class="num">ใช้จริง</th><th class="num">ต้นทุนใช้ไป</th><th class="num">ส่วนต่างนับ</th></tr></thead><tbody>${

/* ================= รายงานสิ้นเดือน (แบบใบตรวจเช็คสต๊อก) ================= */
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_ML=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const ymOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const ymLabel=(ym,long)=>{ const [y,m]=ym.split('-').map(Number); return long?TH_ML[m-1]+' '+(y+543):TH_M[m-1]+' '+String(y+543).slice(-2); };
function monthRange(ym){ const [y,m]=ym.split('-').map(Number); return [new Date(y,m-1,1).toISOString(),new Date(y,m,1).toISOString()]; }
function reportMonths(){
  let first=new Date();
  S.moves.forEach(m=>{ const d=new Date(m.time); if(d<first) first=d; });
  const out=[], cur=new Date(first.getFullYear(),first.getMonth(),1), now=new Date();
  while(cur<=now){ out.push(ymOf(cur)); cur.setMonth(cur.getMonth()+1); }
  return out.reverse();
}
// ต้นทุนต่อหน่วย (ถัวเฉลี่ย) ณ เวลา T โดยไล่รายการรับ/เบิกตั้งแต่ต้น
function costAt(it,hist,T){
  let q=0,c=null;
  for(const m of hist){
    if(m.time>=T) break;
    if(m.type==='in'){ const nq=Math.max(q,0)+m.delta; c=nq>0?((Math.max(q,0)*(c||0))+m.value)/nq:c; q=nq; }
    else { if(m.type==='adjust'&&m.unitCost!=null) c=m.unitCost; q+=m.delta; }
  }
  return c==null?it.avgCost:c;
}
function monthReport(ym){
  const [s,e]=monthRange(ym);
  const rows=[];
  sortedItems().forEach(it=>{
    const hist=S.moves.filter(m=>m.itemId===it.id).sort((a,b)=>a.time.localeCompare(b.time));
    if(it.createdAt&&it.createdAt>=e&&!(hist[0]&&hist[0].time<e)) return; // ยังไม่มีรายการนี้ในเดือนนั้น
    const sum=l=>l.reduce((t,m)=>t+(m.delta||0),0);
    const openQty=r4(it.qty-sum(hist.filter(m=>m.time>=s))), closeQty=r4(it.qty-sum(hist.filter(m=>m.time>=e)));
    const inMonth=hist.filter(m=>m.time>=s&&m.time<e);
    const buys=inMonth.filter(m=>m.type==='in').map(m=>({qty:m.delta,unit:m.unitCost,total:m.value,time:m.time}));
    const buyQty=r4(buys.reduce((t,b)=>t+b.qty,0)), buyVal=r2(buys.reduce((t,b)=>t+b.total,0));
    const outQty=r4(-sum(inMonth.filter(m=>m.type==='out'))), wasteQty=r4(-sum(inMonth.filter(m=>m.type==='waste'))), adjQty=r4(sum(inMonth.filter(m=>m.type==='adjust')));
    const unit=costAt(it,hist,e), openCost=costAt(it,hist,s);
    const toOrder=closeQty<=it.low?(it.max?r4(Math.max(it.max-closeQty,0)):null):0;
    rows.push({it,openQty,openVal:r2(openQty*openCost),buys,buyQty,buyVal,afterBuy:r4(openQty+buyQty),outQty,wasteQty,adjQty,closeQty,unit:r2(unit),value:r2(closeQty*unit),toOrder,below:closeQty<=it.low,above:it.max?closeQty>it.max:false});
  });
  const rounds=Math.max(2,...rows.map(r=>r.buys.length));
  const T={openVal:0,buyVal:0,value:0};
  rows.forEach(r=>{ T.openVal+=r.openVal; T.buyVal+=r.buyVal; T.value+=r.value; });
  Object.keys(T).forEach(k=>T[k]=r2(T[k]));
  return {ym,rows,rounds,totals:T,below:rows.filter(r=>r.below).length};
}
function shopLi(r){ return `<li>${esc(r.it.name)} — ${r.toOrder?'สั่ง <b>'+fmt(r.toOrder)+' '+esc(r.it.unit)+'</b> ':''}<span class="note">(เหลือ ${fmt(r.closeQty)})</span></li>`; }

function reportHtml(){

  const cats=[...new Set(R.rows.map(r=>r.it.cat||'อื่นๆ'))];
  const cols=18+R.rounds;
  const need=R0.rows.filter(r=>r.below);
  const cards=R.rows.length?R.rows.map(r=>{ const ex=expState(r.it);
    return `<div class="rcard"><div class="top"><span>${esc(r.it.name)} <span class="code">${esc(r.it.code||'')}</span></span><span>${baht(r.value)}</span></div>
    <div class="note">${esc(r.it.cat||'อื่นๆ')} · ราคาต่อหน่วย ${baht(r.unit)}/${esc(r.it.unit)}${r.buys.length?' · ซื้อ '+r.buys.length+' รอบ ('+baht(r.buyVal)+')':''}</div>

function reportAoa(ym){
  const R=monthReport(ym);
  const head1=['รหัสสินค้า','รายการสินค้า','ยี่ห้อ/รุ่น','ที่เก็บ','วันหมดอายุ','กำหนดจำนวน','','หน่วยนับ','ยอดยกมา','จำนวนสั่งซื้อ'];
  const head2=['','','','','','ขั้นต่ำสุด','ขั้นสูงสุด','','',''];
  for(let i=0;i<R.rounds;i++){ head1.push(i===0?'รายการที่สั่งซื้อ / ราคาต่อหน่วย':''); head2.push('รอบที่ '+(i+1)); }
  head1.push('รวมยอดหลังสั่งซื้อ','รวมยอดเบิก','ของเสีย','ปรับยอด (นับ)','รวมคงเหลือ','ราคาต่อหน่วย','รวมมูลค่า','หมายเหตุ');
  head2.push('','','','','','','','');
  const aoa=[['รายการตรวจเช็คสต๊อกวัตถุดิบ ณ วันสิ้นเดือน ประจำเดือน '+ymLabel(ym,true)+' — มากิน มาม่า'],head1,head2];
  const cats=[...new Set(R.rows.map(r=>r.it.cat||'อื่นๆ'))];
  cats.forEach(c=>{
    const rs=R.rows.filter(r=>(r.it.cat||'อื่นๆ')===c);
    aoa.push(['',c]);
    rs.forEach(r=>{
      const row=[r.it.code||'',r.it.name,r.it.brand||'',r.it.loc||'',r.it.exp?dd(r.it.exp):'',r.it.low,r.it.max??'',r.it.unit,r.openQty,r.buyQty];
      for(let i=0;i<R.rounds;i++){ const b=r.buys[i]; row.push(b?fmt(b.qty)+' @ '+r2(b.unit)+' ('+new Date(b.time).toLocaleDateString('th-TH',{day:'numeric',month:'short'})+')':''); }
      row.push(r.afterBuy,r.outQty,r.wasteQty,r.adjQty,r.closeQty,r.unit,r.value,(r.below?'ควรสั่ง'+(r.toOrder?' '+r.toOrder+' '+r.it.unit:''):r.above?'เกินขั้นสูงสุด':'')+(expState(r.it)?' '+expState(r.it):''));
      aoa.push(row);
    });
  });
  const last=head1.length;
  const tot=Array(last).fill(''); tot[1]='รวมมูลค่าคงเหลือทั้งหมด'; tot[last-2]=R.totals.value; aoa.push(tot);
  return {aoa,rounds:R.rounds,width:last};
}
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);

async function exportXlsx(all){
  let X; try{ X=await loadXlsx(); }catch(e){ return toast(e.message); }
  const wb=X.utils.book_new();
  const months=all?reportMonths().slice().reverse():[S.reportYm];
  months.forEach(ym=>{
    const {aoa,rounds,width}=reportAoa(ym), ws=X.utils.aoa_to_sheet(aoa);
    const ro=10;
    ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:width-1}},{s:{r:1,c:5},e:{r:1,c:6}},{s:{r:1,c:ro},e:{r:1,c:ro+rounds-1}}]
      .concat([0,1,2,3,4,7,8,9].map(c=>({s:{r:1,c},e:{r:2,c}})))
      .concat(Array.from({length:8},(_,i)=>({s:{r:1,c:ro+rounds+i},e:{r:2,c:ro+rounds+i}})));
    ws['!cols']=[{wch:9},{wch:26},{wch:14},{wch:12},{wch:11},{wch:8},{wch:8},{wch:8},{wch:9},{wch:9}].concat(Array.from({length:rounds},()=>({wch:20}))).concat([{wch:10},{wch:9},{wch:8},{wch:9},{wch:9},{wch:10},{wch:12},{wch:24}]);
    X.utils.book_append_sheet(wb,ws,ymLabel(ym));
  });
  X.writeFile(wb,'สต๊อกมากินมาม่า_'+(all?'ทุกเดือน':ymLabel(S.reportYm).replace(/[. ]/g,''))+'.xlsx');
}
function pickItem(id){

  if(i>=0) S.batch.splice(i,1); else S.batch.push({itemId:id,qty:S.moveType==='in'?'':1,price:'',pm:'unit'});
  renderPick(); renderBatch();
  if(i<0){ const inp=document.querySelector(`[data-b="${S.batch.length-1}|qty"]`); if(inp&&S.moveType==='in') inp.focus(); }

async function saveBatch(){
  if(!S.batch.length) return toast('เลือกวัตถุดิบก่อน');
  if(!needUser()) return;
  const t=S.moveType, note=($('#mv_note')||{}).value?.trim()||'';
  for(const l of S.batch){
    const it=S.items.find(i=>i.id===l.itemId); if(!it) continue;
    const q=posn(l.qty); if(q===null||q<=0) return toast('ใส่จำนวนของ '+it.name);
    if(t==='in'){ const p=posn(l.price); if(p===null||p<0) return toast('ใส่ราคาของ '+it.name+' (ใส่ 0 ได้ถ้าของแถม)'); }
    else if(q>it.qty+1e-9) return toast(it.name+' มีไม่พอ (เหลือ '+fmt(it.qty)+' '+it.unit+')');
  }
  let n=0;
  for(const l of S.batch){
    const q=posn(l.qty), mv={type:t,itemId:l.itemId,qty:q,note};
    if(t==='in'){ const p=posn(l.price); mv.totalCost=r2(l.pm==='total'?p:p*q); }
    if(await commitMove(mv)) n++; else break;
  }
  S.batch=S.batch.slice(n); if($('#mv_note')&&!S.batch.length) $('#mv_note').value='';
  renderPick(); renderBatch();
  toast(n?'บันทึกแล้ว '+n+' รายการ':'บันทึกไม่สำเร็จ');
}
async function saveCount(){
  const ch=Object.entries(S.countDraft).map(([id,v])=>[S.items.find(i=>i.id===id),v]).filter(([i,v])=>i&&v!=null&&!isNaN(v)&&Math.abs(v-i.qty)>1e-9);
  const same=Object.keys(S.countDraft).length-ch.length;
  if(!ch.length){ if(same){ S.countDraft={}; sv('countDraft',{}); refreshLive(true); return toast('ยอดตรงกับระบบทั้งหมด ✓'); } return toast('ยังไม่ได้กรอกยอดที่นับ'); }
  if(ch.some(([,v])=>v<0)) return toast('ยอดนับติดลบไม่ได้');
  if(!needUser()) return;
  if(!confirm('บันทึกผลนับ '+ch.length+' รายการ? ระบบจะปรับยอดให้ตรงกับที่นับ')) return;
  const note='นับสต๊อก '+new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short'});
  let n=0;
  for(const [i,v] of ch){ if(await commitMove({type:'adjust',itemId:i.id,setTo:v,note})){ delete S.countDraft[i.id]; n++; } else break; }
  if(n===ch.length) S.countDraft={};
  sv('countDraft',S.countDraft); refreshLive(true); toast('ปรับยอดแล้ว '+n+' รายการ');
}
async function shareOrder(){

  const txt='🛒 รายการสั่งซื้อ มากิน มาม่า ('+new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'})+')\n'+need.map((n,k)=>(k+1)+'. '+n.it.name+(n.qty?' — '+fmt(n.qty)+' '+n.it.unit:'')+' (เหลือ '+fmt(n.it.qty)+')').join('\n');

function startWizard(kind){

async function confirmOpen(){
  if(openPeriod()) return toast('มีงวดที่เปิดอยู่แล้ว');
  if(!S.items.length) return toast('ยังไม่มีวัตถุดิบ'); if(!needUser()) return;
  const items=[...S.items];
  for(const i of items){ const d=S.draft[i.id]||{}; const q=d.qty==null||isNaN(d.qty)?i.qty:d.qty, c=d.cost==null||isNaN(d.cost)?i.avgCost:d.cost; if(q<0||c<0) return toast('ค่าติดลบไม่ได้: '+i.name); }
  const opening={};
  for(const i of items){
    const d=S.draft[i.id]||{}; const q=d.qty==null||isNaN(d.qty)?i.qty:d.qty, c=d.cost==null||isNaN(d.cost)?i.avgCost:d.cost;
    if(Math.abs(q-i.qty)>1e-9||Math.abs(c-i.avgCost)>1e-9) if(!(await commitMove({type:'adjust',itemId:i.id,setTo:q,setCost:c,note:'นับต้นงวด'}))) return;
    opening[i.id]={qty:q,cost:c};
  }
  await putPeriod({id:uid(),name:($('#pname').value||'').trim()||'งวดใหม่',startTime:new Date().toISOString(),endTime:null,status:'open',opening,openedBy:S.user});
  S.wizard=null; S.draft={}; toast('เปิดงวดแล้ว'); refreshLive(true);
}
async function confirmClose(){
  const p=openPeriod(); if(!p) return; if(!needUser()) return;
  const counts=draftCounts(); if(Object.values(counts).some(v=>v<0)) return toast('ค่านับติดลบไม่ได้');
  const sm=calcSummary(p,counts);
  if(!confirm('ปิดงวด "'+p.name+'"?\nต้นทุนวัตถุดิบที่ใช้จริง: '+baht(sm.totals.cogs)+'\nหลังปิดแล้วแก้ไขตัวเลขงวดนี้ไม่ได้')) return;
  for(const i of [...S.items]) if(Math.abs(counts[i.id]-i.qty)>1e-9) if(!(await commitMove({type:'adjust',itemId:i.id,setTo:counts[i.id],note:'นับปลายงวด'}))) return;
  await putPeriod({...p,status:'closed',endTime:new Date().toISOString(),closedBy:S.user,summary:sm});
  S.wizard=null; S.draft={}; S.viewPeriod=p.id; toast('ปิดงวดแล้ว'); refreshLive(true);
}

  if(s.state==='offline') return '<span class="note">🟡 ออฟไลน์/กำลังเชื่อมต่อใหม่ — บันทึกในเครื่องไว้แล้ว'+(s.pending?' รอส่ง '+s.pending+' รายการ':'')+'</span>';
  if(s.state==='connecting') return '<span class="note">⏳ กำลังเชื่อมต่อ...</span>';
  return '<span class="note">🔴 ยังไม่เชื่อมต่อ (เก็บในเครื่องนี้เท่านั้น)</span>';
}
async function connectFb(code){
  try{ if(await syncStore.start(code)){ S.last=new Date(); if(code) toast('เชื่อมต่อ Supabase แล้ว'); } }
  catch(e){ toast(e.message); }
}

/* ================= events ================= */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v;
  if(a==='tab'){ e.preventDefault(); if(S.wizard&&!confirm('กำลังกรอกข้อมูลนับสต๊อกอยู่ ออกจากหน้านี้และทิ้งข้อมูลที่กรอก?')) return; S.wizard=null; S.tab=v; renderTab(); window.scrollTo(0,0); }
  else if(a==='quick'){ if(S.moveType!==v) S.batch=[]; S.moveType=v; S.tab='moves'; renderTab(); window.scrollTo(0,0); }
  else if(a==='pickItem') pickItem(v);
  else if(a==='rmLine'){ S.batch.splice(+v,1); renderPick(); renderBatch(); }
  else if(a==='stepQ'){ const [i,d]=v.split('|'); const l=S.batch[+i]; if(l){ l.qty=Math.max(0,r4((Number(l.qty)||0)+Number(d))); renderBatch(); } }
  else if(a==='pmode'){ const [i,m]=v.split('|'); if(S.batch[+i]){ S.batch[+i].pm=m; renderBatch(); } }
  else if(a==='saveBatch') saveBatch();
  else if(a==='pickCat'){ S.pickCat=v; $('#pickchips').innerHTML=chipsHtml('pickCat',v); renderPick(); }
  else if(a==='itemCat'){ S.itemCat=v; $('#itemchips').innerHTML=chipsHtml('itemCat',v); refreshLive(true); }
  else if(a==='cntCat'){ S.cntCat=v; $('#cntchips').innerHTML=chipsHtml('cntCat',v); refreshLive(true); }
  else if(a==='repFilter'){ S.repFilter=v; refreshLive(true); }
  else if(a==='repMode'){ S.repMode=v; renderTab(); }
  else if(a==='saveCount') saveCount();
  else if(a==='clearCount'){ if(Object.keys(S.countDraft).length&&!confirm('ล้างยอดที่กรอกไว้ทั้งหมด?')) return; S.countDraft={}; sv('countDraft',{}); refreshLive(true); }
  else if(a==='shareOrder') shareOrder();
  else if(a==='showForm'){ S.showForm=true; renderTab(); setTimeout(()=>{ const n=$('#in_name'); if(n) n.focus(); },50); }
  else if(a==='setUser'||a==='saveUser'){ if(a==='setUser'){S.tab='settings';renderTab();return} const n=$('#uname').value.trim(); S.user=n; sv('user',n); renderHeader(); toast('บันทึกชื่อแล้ว'); }
  else if(a==='addItem') addItem();
  else if(a==='editItem'){ S.editId=v; renderTab(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(a==='cancelEdit'){ S.editId=null; S.showForm=false; renderTab(); }
  else if(a==='exportXlsx') exportXlsx(v==='all');
  else if(a==='print') window.print();
  else if(a==='seed') seed();
  else if(a==='delItem'){ const it=S.items.find(i=>i.id===v); if(it&&confirm('ลบ "'+it.name+'"? ประวัติรับ/เบิกเดิมยังอยู่ แต่จะไม่นับในสรุปงวดต่อไป')) removeItem(v); }
  else if(a==='mtype'){ if(v!==S.moveType&&S.batch.length&&!confirm('เปลี่ยนประเภทจะล้างรายการที่เลือกไว้ ต่อไหม?')) return; if(v!==S.moveType) S.batch=[]; S.moveType=v; renderTab(); }
  else if(a==='wizOpen') startWizard('open');
  else if(a==='wizClose') startWizard('close');
  else if(a==='wizCancel'){ S.wizard=null; S.draft={}; refreshLive(true); }
  else if(a==='confirmOpen') confirmOpen();
  else if(a==='confirmClose') confirmClose();
  else if(a==='viewPeriod'){ S.viewPeriod=v; refreshLive(true); }
  else if(a==='exportMoves') exportMoves();
  else if(a==='exportPeriod') exportPeriod(v);
  else if(a==='connect'){ const code=$('#fbcode').value; if(!code) return toast('กรุณาใส่รหัสร้าน'); connectFb(code); }
  else if(a==='disconnect'){ syncStore.stop(); toast('หยุดซิงก์แล้ว — ข้อมูลที่แก้จะถูกส่งขึ้นเมื่อเชื่อมต่อใหม่'); }
  else if(a==='resetLocal'){ if(syncOn()) return toast('หยุดซิงก์ก่อน (กันลบข้อมูลกลางโดยไม่ตั้งใจ)'); if(confirm('ล้างข้อมูลสต๊อกทั้งหมดในเครื่องนี้? ย้อนกลับไม่ได้ (ข้อมูลบน Supabase ไม่ถูกลบ)')){ ['items','moves','periods'].forEach(k=>{S[k]=[];sv(k,[])}); syncStore.forget(); S.wizard=null; renderTab(); toast('ล้างแล้ว'); } }
});
document.addEventListener('focusout',()=>{ setTimeout(()=>{ if(S.deferred){ const ae=document.activeElement; if(!(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)&&ae.closest('#view'))) refreshLive(); } },0); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.c){ const all=[...document.querySelectorAll('[data-c]')], k=all.indexOf(e.target); if(all[k+1]){ e.preventDefault(); all[k+1].focus(); } } });
document.addEventListener('change',e=>{ if(e.target.id==='rep_ym'){ S.reportYm=e.target.value; refreshLive(); } });
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='pick_q'){ S.pickQ=t.value; renderPick(); return; }
  if(t.id==='item_q'){ S.itemQ=t.value; const L=$('#live'); if(L) L.innerHTML=itemsLive(); return; }
  if(t.id==='cnt_q'){ S.cntQ=t.value; const L=$('#live'); if(L) L.innerHTML=countRows(); return; }
  if(t.dataset.b){ const [i,f]=t.dataset.b.split('|'); const l=S.batch[+i]; if(!l) return; l[f]=t.value; const a=lineAfter(l), el=$('#after-'+i); if(el){ el.innerHTML=a.txt; el.className='after'+(a.bad?' bad':''); } updateBatchBar(); return; }
  if(t.dataset.c){ const id=t.dataset.c; if(t.value==='') delete S.countDraft[id]; else S.countDraft[id]=parseFloat(t.value); sv('countDraft',S.countDraft); const i=S.items.find(x=>x.id===id), el=$('#diff-'+id); if(el&&i) el.innerHTML=diffTxt(i); updateCountBar(); return; }
  if(!t.dataset.d) return;
  const [id,f]=t.dataset.d.split('|'); (S.draft[id]=S.draft[id]||{})[f]=t.value===''?undefined:parseFloat(t.value);
  if(S.wizard==='close') updatePrev();
});
window.addEventListener('storage',e=>{ if(syncOn()||!e.key||!e.key.startsWith(LS)) return; ['items','moves','periods'].forEach(k=>S[k]=ld(k,[])); S.last=new Date(); refreshLive(); }); // เปิดหลายแท็บในเครื่องเดียวกัน

/* ================= init ================= */
['items','moves','periods'].forEach(k=>S[k]=ld(k,[]));
renderTab();
connectFb();
</script>
</body>
</html>
