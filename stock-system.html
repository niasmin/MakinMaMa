<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>มากิน มาม่า — ระบบสต๊อก</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="mm-sync.js"></script>
<style>
:root{--bg:#FFFBEA;--panel:#fff;--ink:#3A2400;--soft:#8A7A4E;--red:#C41E2A;--red-d:#8F1420;--red-s:#FCE9C8;--gold:#C6791E;--gold-s:#FBEBD3;--green:#2F9E52;--green-s:#E3F5E9;--line:#F3E6BE;--top:#FFCB05;--top-ink:#7A0000;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.k{font-family:'Kanit',sans-serif}
header{background:var(--top);color:var(--top-ink);border-bottom:3px solid var(--red);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{width:38px;height:38px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--red)}
.brand{font-family:'Kanit';font-weight:700;font-size:18px;flex:1;min-width:150px}
.badge{font-size:12px;padding:4px 10px;border-radius:999px;background:#fff;color:var(--soft);font-weight:600}
.badge.on{background:var(--green-s);color:var(--green)}
.userbtn{background:rgba(255,255,255,.6);border:none;border-radius:999px;padding:5px 12px;font-family:'Sarabun';font-size:12.5px;cursor:pointer;color:var(--top-ink)}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;position:sticky;top:0;z-index:5}
nav button{background:none;border:none;border-bottom:3px solid transparent;padding:12px 12px 9px;font-family:'Kanit';font-size:14px;color:var(--soft);cursor:pointer;white-space:nowrap;font-weight:500}
nav button.on{color:var(--red);border-bottom-color:var(--red)}
main{max-width:980px;margin:0 auto;padding:16px 14px 90px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px}
.stat .n{font-family:'Kanit';font-weight:700;font-size:21px;color:var(--red-d)}
.stat .l{font-size:12.5px;color:var(--soft)}
.stat.warn .n{color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.f{flex:1;min-width:120px}
.f label{display:block;font-size:12px;color:var(--soft);margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;font-family:'Sarabun';font-size:14px;background:#fff;color:var(--ink)}
button.p{background:var(--red);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-family:'Kanit';font-weight:600;font-size:14px;cursor:pointer}
button.s{background:#fff;color:var(--red-d);border:1.5px solid var(--red-s);border-radius:10px;padding:9px 14px;font-family:'Kanit';font-size:13px;cursor:pointer}
button.g{background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-family:'Kanit';font-weight:600;cursor:pointer}
button.x{background:none;border:none;color:#C9A6A6;cursor:pointer;font-size:16px}
.types{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.types button{flex:1;min-width:90px;padding:9px 4px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-family:'Kanit';font-size:13.5px;cursor:pointer;color:var(--soft)}
.types button.on{background:var(--red);border-color:var(--red);color:#fff}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--red-s);color:var(--red-d);font-family:'Kanit';font-size:12.5px;text-align:left;padding:8px 10px;white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}
td input{width:90px;padding:6px 8px}
.num{text-align:right}
.tag{display:inline-block;font-family:'Kanit';font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px}
.t-in{background:var(--green-s);color:var(--green)}.t-out{background:var(--red-s);color:var(--red-d)}.t-waste{background:#FFE0DD;color:var(--red)}.t-adjust{background:var(--gold-s);color:var(--gold)}
.low{color:var(--gold);font-weight:700}
.note{font-size:12.5px;color:var(--soft);line-height:1.6}
.empty{text-align:center;color:var(--soft);padding:22px 0;font-size:14px}
.banner{background:#FFF3C4;border:1.5px solid var(--gold);color:#7A5100;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;line-height:1.6}
.err{color:var(--red-d);font-size:13px;margin:6px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.item-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.item-row:first-of-type{border-top:none}
.item-row .nm{flex:1;min-width:140px;font-weight:600}
</style>
</head>

<script>
/* ================= helpers & storage ================= */
const LS='mmst_';
const ld=(k,d)=>{try{const r=localStorage.getItem(LS+k);return r===null?d:JSON.parse(r)}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(LS+k,JSON.stringify(v));return true}catch(e){toast('บันทึกในเครื่องไม่สำเร็จ (พื้นที่เต็มหรือถูกบล็อก)');return false}};
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=(n,d=2)=>Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:d});
const baht=n=>'฿'+fmt(n,2);
const r4=n=>Math.round(n*10000)/10000;
const dt=iso=>new Date(iso).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const dd=iso=>new Date(iso).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
const TL={in:'รับเข้า',out:'เบิกใช้',waste:'ของเสีย',adjust:'ปรับยอด/นับ'};

const S={items:[],moves:[],periods:[],tab:'dash',user:ld('user',''),sync:{state:'off',pending:0,error:''},last:null,wizard:null,draft:{},viewPeriod:null,moveType:'in'};

const SEED=[['มาม่าไทย','ซอง'],['มาม่าบิ๊กแพ็ค','ซอง'],['มาม่าเกาหลี','ซอง'],['ไข่ไก่','ฟอง'],['ผักสด','ชุด'],['ลูกชิ้นไก่','ลูก'],['ลูกชิ้นปลา','ลูก'],['ลูกชิ้นเนื้อ','ลูก'],['ไส้กรอกหนังกรอบ','ชิ้น'],['เต้าหู้','ชิ้น'],['เนื้อวัว','กรัม'],['ไก่สับ','กรัม'],['สาหร่ายวากาเมะ','ห่อ'],['โบโลน่า','ชิ้น'],['แฮมไก่','ชิ้น'],['ปูอัด','ชิ้น'],['ชีสแผ่น','แผ่น'],['ไก่ฉีก','กรัม'],['หนังไก่กรอบ','ชิ้น'],['ปลาหมึก','กรัม'],['กุ้ง','ตัว'],['นักเกต','ชิ้น'],['ชีสบอล','ชิ้น'],['เฟรนช์ฟราย','กรัม'],['ไก่ป๊อป','ชิ้น'],['ไก่ไร้กระดูก','ชิ้น'],['ซอสเกาหลี','มล.'],['ซอสเทอริยากิ','มล.'],['ข้าวสวย','ถ้วย'],['ไอศกรีมเนสเล่','ถ้วย'],['น้ำดื่ม','ขวด'],['น้ำแข็ง','กก.']];

/* ---- data layer: เก็บใน localStorage เสมอ ถ้าต่อ Supabase จะเขียนขึ้นรายรายการด้วย (กันเขียนทับกันระหว่างอุปกรณ์) ---- */
// ยอดคงเหลือ (qty) ส่งเป็นส่วนต่าง ตัด/รับพร้อมกันหลายเครื่องก็ไม่หาย, ของที่บันทึกตอนออฟไลน์จะถูกส่งขึ้นภายหลัง
const syncStore=MMSync.createStore({
  name:'stock',
  keys:{items:{list:true,coll:'stock_items',delta:['qty']},moves:{list:true,coll:'stock_moves'},periods:{list:true,coll:'stock_periods'}},
  get:k=>S[k], set:(k,v)=>{ S[k]=v; sv(k,v); },
  onData:()=>{ S.last=new Date(); refreshLive(); },
  onStatus:s=>{ const re=(S.sync.state==='off')!==(s.state==='off'); S.sync=s; if(re&&S.tab==='settings') renderTab(); else { renderHeader(); const el=$('#syncst'); if(el) el.innerHTML=syncLabel(); const er=$('#syncerr'); if(er) er.textContent=s.error?'⚠ '+s.error:''; } },
});
const syncOn=()=>S.sync.state!=='off';
function upsertLocal(k,o){ const i=S[k].findIndex(x=>x.id===o.id); i<0?S[k].push(o):S[k][i]=o; sv(k,S[k]); }
function putItem(it){ upsertLocal('items',it); afterChange(); syncStore.save(); }
function removeItem(id){ S.items=S.items.filter(x=>x.id!==id); sv('items',S.items); afterChange(); syncStore.save(); }
function putPeriod(p){ upsertLocal('periods',p); afterChange(); syncStore.save(); }
const openPeriod=()=>S.periods.find(p=>p.status==='open')||null;

function applyToItem(it,mv){
  const o={...it}, q=Number(mv.qty)||0;
  if(mv.type==='in'){ const nq=it.qty+q; o.avgCost=nq>0?r4(((it.qty*it.avgCost)+mv.totalCost)/nq):it.avgCost; o.qty=nq; return {item:o,delta:q,unitCost:q>0?r4(mv.totalCost/q):0,value:mv.totalCost}; }
  if(mv.type==='out'||mv.type==='waste'){ const use=Math.min(q,it.qty); o.qty=r4(it.qty-use); return {item:o,delta:-use,unitCost:it.avgCost,value:r4(use*it.avgCost)}; }
  const d=mv.setTo-it.qty; if(mv.setCost!=null) o.avgCost=mv.setCost; o.qty=mv.setTo; return {item:o,delta:r4(d),unitCost:o.avgCost,value:r4(d*o.avgCost)};
}
function commitMove(mv){
  const it=S.items.find(x=>x.id===mv.itemId); if(!it) return Promise.resolve(false);
  const op=openPeriod();
  Object.assign(mv,{id:uid(),time:new Date().toISOString(),by:S.user||'-',name:it.name,unit:it.unit,periodId:op?op.id:null});
  const local=()=>{
    const cur=S.items.find(x=>x.id===mv.itemId)||it, res=applyToItem(cur,mv); upsertLocal('items',res.item);
    Object.assign(mv,{delta:res.delta,unitCost:res.unitCost,value:res.value}); upsertLocal('moves',mv); afterChange(); syncStore.save();
    return true;
  };
  if(S.sync.state==='online' && !syncStore.isDirty('items',it.id)){
    // ออนไลน์: คำนวณจากค่าล่าสุดบนเซิร์ฟเวอร์แบบกันชนกัน (ต้นทุนเฉลี่ยแม่นยำแม้หลายเครื่องรับของพร้อมกัน)
    let res=null;
    return syncStore.mutate('items',it.id,cur=>{ res=applyToItem(cur,mv); return res.item; }).then(saved=>{
      if(saved===undefined||!res) return local(); // ยังไม่มีบนเซิร์ฟเวอร์ — บันทึกในเครื่องแล้วซิงก์ตามปกติ
      Object.assign(mv,{delta:res.delta,unitCost:res.unitCost,value:res.value}); upsertLocal('moves',mv); afterChange(); syncStore.save();
      return true;
    },()=>local()); // เน็ตหลุดระหว่างทาง — บันทึกในเครื่อง ยอดส่งเป็นส่วนต่างภายหลัง
  }
  return Promise.resolve(local());
}

/* ================= period maths ================= */
function calcSummary(p,counts){
  const rows=[]; let T={openVal:0,buy:0,closeVal:0,cogs:0,wasteVal:0,varVal:0};
  S.items.forEach(it=>{
    const op=p.opening[it.id]||{qty:0,cost:0};
    const mv=S.moves.filter(m=>m.periodId===p.id&&m.itemId===it.id);
    let inQ=0,inC=0,outQ=0,wasteQ=0,wasteV=0;
    mv.forEach(m=>{ if(m.type==='in'){inQ+=m.qty;inC+=m.value} else if(m.type==='out') outQ+=m.qty; else if(m.type==='waste'){wasteQ+=-m.delta;wasteV+=m.value} });
    const sys=it.qty, phys=counts&&counts[it.id]!=null?counts[it.id]:sys, cc=it.avgCost;
    if(!op.qty&&!inQ&&!outQ&&!wasteQ&&!sys&&!phys) return;
    const cogs=op.qty*op.cost+inC-phys*cc;
    const r={id:it.id,name:it.name,unit:it.unit,openQty:op.qty,openCost:op.cost,inQty:inQ,inCost:inC,outQty:outQ,wasteQty:wasteQ,sysQty:sys,physQty:phys,closeCost:cc,usedQty:r4(op.qty+inQ-phys),cogs:r4(cogs),varQty:r4(sys-phys),varVal:r4((sys-phys)*cc)};
    rows.push(r); T.openVal+=op.qty*op.cost; T.buy+=inC; T.closeVal+=phys*cc; T.cogs+=cogs; T.wasteVal+=wasteV; T.varVal+=r.varVal;
  });
  Object.keys(T).forEach(k=>T[k]=r4(T[k]));
  return {rows,totals:T};
}

  if(S.tab==='dash') L.innerHTML=dashHtml();
  else if(S.tab==='items') L.innerHTML=itemsLive();
  else if(S.tab==='moves'){ L.innerHTML=movesLive(); const s=$('#mv_item'); if(s){const cur=s.value; s.innerHTML=itemOptions(); s.value=cur;} }
  else if(S.tab==='periods'){ if(S.wizard){ if(force){L.innerHTML=wizardHtml(); if(S.wizard==='close') updatePrev();} } else L.innerHTML=periodsHtml(); }
}
function afterChange(){ S.last=new Date(); refreshLive(); }

/* ================= actions ================= */
const posn=v=>(v===''||v==null||isNaN(v))?null:Number(v);
function needUser(){ if(S.user) return true; const n=prompt('ใส่ชื่อของคุณ (บันทึกไว้ในรายการ)'); if(n&&n.trim()){S.user=n.trim();sv('user',S.user);renderHeader();return true} toast('กรุณาใส่ชื่อผู้ใช้ก่อน'); return false; }

async function addItem(){
  const name=$('#in_name').value.trim(), unit=$('#in_unit').value.trim()||'หน่วย', low=posn($('#in_low').value);
  if(!name) return toast('กรอกชื่อวัตถุดิบ');
  if(S.items.some(i=>i.name===name)) return toast('มีวัตถุดิบชื่อนี้แล้ว');
  if(low===null||low<0) return toast('ค่าแจ้งเตือนต้องไม่ติดลบ');
  await putItem({id:uid(),name,unit,qty:0,avgCost:0,low,createdAt:new Date().toISOString()});
  $('#in_name').value=''; $('#in_unit').value=''; toast('เพิ่มวัตถุดิบแล้ว');
}
async function seed(){ for(const [n,u] of SEED){ if(!S.items.some(i=>i.name===n)) await putItem({id:uid(),name:n,unit:u,qty:0,avgCost:0,low:(u==='กรัม'||u==='มล.')?500:10,createdAt:new Date().toISOString()}); } toast('เพิ่มรายการตั้งต้นแล้ว'); }
async function submitMove(){
  if(!needUser()) return;
  const itemId=$('#mv_item').value, q=posn($('#mv_qty').value), note=$('#mv_note').value.trim(), t=S.moveType;
  const it=S.items.find(i=>i.id===itemId);
  if(!it) return toast('เลือกวัตถุดิบ');
  if(q===null||q<0||(t!=='adjust'&&q<=0)) return toast(t==='adjust'?'ใส่จำนวนที่นับได้ (ไม่ติดลบ)':'ใส่จำนวนที่มากกว่า 0');
  let mv={type:t,itemId,qty:q,note};
  if(t==='in'){ const c=posn(($('#mv_cost')||{}).value); if(c===null||c<0) return toast('ใส่ราคารวมที่จ่าย (ใส่ 0 ได้ถ้าของแถม)'); mv.totalCost=c; }
  if(t==='out'||t==='waste'){ if(q>it.qty+1e-9) return toast('จำนวนมากกว่าสต๊อกที่มี ('+fmt(it.qty)+' '+it.unit+')'); }
  if(t==='adjust'){ mv={type:'adjust',itemId,setTo:q,note:note||'นับ/ปรับยอด'}; }
  if(await commitMove(mv)){ $('#mv_qty').value=''; $('#mv_note').value=''; if($('#mv_cost')) $('#mv_cost').value=''; toast('บันทึกแล้ว'); }
}
function startWizard(kind){
  S.wizard=kind; S.draft={};
  S.items.forEach(i=>{ S.draft[i.id]=kind==='open'?{qty:i.qty,cost:i.avgCost}:{qty:i.qty}; });
  refreshLive(true);
}
async function confirmOpen(){
  if(openPeriod()) return toast('มีงวดที่เปิดอยู่แล้ว');
  if(!S.items.length) return toast('ยังไม่มีวัตถุดิบ'); if(!needUser()) return;
  const items=[...S.items];
  for(const i of items){ const d=S.draft[i.id]||{}; const q=d.qty==null||isNaN(d.qty)?i.qty:d.qty, c=d.cost==null||isNaN(d.cost)?i.avgCost:d.cost; if(q<0||c<0) return toast('ค่าติดลบไม่ได้: '+i.name); }
  const opening={};
  for(const i of items){
    const d=S.draft[i.id]||{}; const q=d.qty==null||isNaN(d.qty)?i.qty:d.qty, c=d.cost==null||isNaN(d.cost)?i.avgCost:d.cost;
    if(Math.abs(q-i.qty)>1e-9||Math.abs(c-i.avgCost)>1e-9) if(!(await commitMove({type:'adjust',itemId:i.id,setTo:q,setCost:c,note:'นับต้นงวด'}))) return;
    opening[i.id]={qty:q,cost:c};
  }
  await putPeriod({id:uid(),name:($('#pname').value||'').trim()||'งวดใหม่',startTime:new Date().toISOString(),endTime:null,status:'open',opening,openedBy:S.user});
  S.wizard=null; S.draft={}; toast('เปิดงวดแล้ว'); refreshLive(true);
}
async function confirmClose(){
  const p=openPeriod(); if(!p) return; if(!needUser()) return;
  const counts=draftCounts(); if(Object.values(counts).some(v=>v<0)) return toast('ค่านับติดลบไม่ได้');
  const sm=calcSummary(p,counts);
  if(!confirm('ปิดงวด "'+p.name+'"?\nต้นทุนวัตถุดิบที่ใช้จริง: '+baht(sm.totals.cogs)+'\nหลังปิดแล้วแก้ไขตัวเลขงวดนี้ไม่ได้')) return;
  for(const i of [...S.items]) if(Math.abs(counts[i.id]-i.qty)>1e-9) if(!(await commitMove({type:'adjust',itemId:i.id,setTo:counts[i.id],note:'นับปลายงวด'}))) return;
  await putPeriod({...p,status:'closed',endTime:new Date().toISOString(),closedBy:S.user,summary:sm});
  S.wizard=null; S.draft={}; S.viewPeriod=p.id; toast('ปิดงวดแล้ว'); refreshLive(true);
}
function download(name,rows){
  const csv=rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'})); a.download=name; document.body.appendChild(a); a.click(); a.remove();
}
function exportMoves(){ download('stock-moves.csv',[['เวลา','ประเภท','วัตถุดิบ','จำนวน','หน่วย','ต้นทุน/หน่วย','มูลค่า','โดย','หมายเหตุ','งวด']].concat(S.moves.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(m=>[new Date(m.time).toLocaleString('th-TH'),TL[m.type],m.name,m.delta,m.unit,m.unitCost,m.value,m.by,m.note||'',(S.periods.find(p=>p.id===m.periodId)||{}).name||'']))); }
function exportPeriod(id){ const p=S.periods.find(x=>x.id===id); if(!p||!p.summary) return; download('period-'+p.name+'.csv',[['วัตถุดิบ','หน่วย','ต้นงวด','ต้นทุนต้นงวด/หน่วย','รับเข้า','ค่ารับเข้า','เบิกใช้','เสีย','ระบบมีปลายงวด','นับจริง','ต้นทุนปลายงวด/หน่วย','ใช้จริง','ต้นทุนใช้ไป','ส่วนต่างนับ','มูลค่าส่วนต่าง']].concat(p.summary.rows.map(r=>[r.name,r.unit,r.openQty,r.openCost,r.inQty,r.inCost,r.outQty,r.wasteQty,r.sysQty,r.physQty,r.closeCost,r.usedQty,r.cogs,r.varQty,r.varVal])).concat([[],['รวม','','','','','','','','','','','',p.summary.totals.cogs,'',p.summary.totals.varVal]])); }

/* ================= Supabase ================= */
function syncLabel(){
  const s=S.sync;
  if(s.state==='online') return '<span style="color:var(--green)">🟢 เชื่อมต่อแล้ว — ทุกอุปกรณ์ของร้านเห็นข้อมูลสดพร้อมกัน'+(s.pending?' (กำลังส่ง '+s.pending+')':'')+'</span>';
  if(s.state==='offline') return '<span class="note">🟡 ออฟไลน์/กำลังเชื่อมต่อใหม่ — บันทึกในเครื่องไว้แล้ว'+(s.pending?' รอส่ง '+s.pending+' รายการ':'')+'</span>';
  if(s.state==='connecting') return '<span class="note">⏳ กำลังเชื่อมต่อ...</span>';
  return '<span class="note">🔴 ยังไม่เชื่อมต่อ (เก็บในเครื่องนี้เท่านั้น)</span>';
}
async function connectFb(code){
  try{ if(await syncStore.start(code)){ S.last=new Date(); if(code) toast('เชื่อมต่อ Supabase แล้ว'); } }
  catch(e){ toast(e.message); }
}

/* ================= events ================= */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v;
  if(a==='tab'){ if(S.wizard&&!confirm('กำลังกรอกข้อมูลนับสต๊อกอยู่ ออกจากหน้านี้และทิ้งข้อมูลที่กรอก?')) return; S.wizard=null; S.tab=v; renderTab(); }
  else if(a==='setUser'||a==='saveUser'){ if(a==='setUser'){S.tab='settings';renderTab();return} const n=$('#uname').value.trim(); S.user=n; sv('user',n); renderHeader(); toast('บันทึกชื่อแล้ว'); }
  else if(a==='addItem') addItem();
  else if(a==='seed') seed();
  else if(a==='delItem'){ const it=S.items.find(i=>i.id===v); if(it&&confirm('ลบ "'+it.name+'"? ประวัติรับ/เบิกเดิมยังอยู่ แต่จะไม่นับในสรุปงวดต่อไป')) removeItem(v); }
  else if(a==='mtype'){ S.moveType=v; renderTab(); }
  else if(a==='submitMove') submitMove();
  else if(a==='wizOpen') startWizard('open');
  else if(a==='wizClose') startWizard('close');
  else if(a==='wizCancel'){ S.wizard=null; S.draft={}; refreshLive(true); }
  else if(a==='confirmOpen') confirmOpen();
  else if(a==='confirmClose') confirmClose();
  else if(a==='viewPeriod'){ S.viewPeriod=v; refreshLive(true); }
  else if(a==='exportMoves') exportMoves();
  else if(a==='exportPeriod') exportPeriod(v);
  else if(a==='connect'){ const code=$('#fbcode').value; if(!code) return toast('กรุณาใส่รหัสร้าน'); connectFb(code); }
  else if(a==='disconnect'){ syncStore.stop(); toast('หยุดซิงก์แล้ว — ข้อมูลที่แก้จะถูกส่งขึ้นเมื่อเชื่อมต่อใหม่'); }
  else if(a==='resetLocal'){ if(syncOn()) return toast('หยุดซิงก์ก่อน (กันลบข้อมูลกลางโดยไม่ตั้งใจ)'); if(confirm('ล้างข้อมูลสต๊อกทั้งหมดในเครื่องนี้? ย้อนกลับไม่ได้ (ข้อมูลบน Supabase ไม่ถูกลบ)')){ ['items','moves','periods'].forEach(k=>{S[k]=[];sv(k,[])}); syncStore.forget(); S.wizard=null; renderTab(); toast('ล้างแล้ว'); } }
});
document.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset.d) return;
  const [id,f]=t.dataset.d.split('|'); (S.draft[id]=S.draft[id]||{})[f]=t.value===''?undefined:parseFloat(t.value);
  if(S.wizard==='close') updatePrev();
});
window.addEventListener('storage',e=>{ if(syncOn()||!e.key||!e.key.startsWith(LS)) return; ['items','moves','periods'].forEach(k=>S[k]=ld(k,[])); S.last=new Date(); refreshLive(); }); // เปิดหลายแท็บในเครื่องเดียวกัน

/* ================= init ================= */
['items','moves','periods'].forEach(k=>S[k]=ld(k,[]));
renderTab();
connectFb();
</script>
</body>
</html>
