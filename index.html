<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>มากิน มาม่า - Back Office</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="mm-sync.js"></script>
<style>
  :root{
    --bg: #FFF8F0; --surface: #FFFFFF; --surface-2: #FFF3E6; --line: #F0DFC8;
    --cream: #2A1B0A; --cream-dim: #7A6A55; --chili: #E5352B; --chili-dim: #FCEAEA;
    --yolk: #F5B400; --scallion: #C77700; --scallion-dim: #FFF3D9; --broth: #C99B5A;
  }
  *{box-sizing:border-box;}
  body{ font-family:'Sarabun',sans-serif; background:var(--bg); color:var(--cream); margin:0; padding:0; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.mm-num,.mm-tabbtn,.mm-add-btn,.mm-brand{ font-family:'Kanit',sans-serif; }
  .mm-header{ padding:14px 16px; background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  .mm-brand{ font-size:22px; font-weight:700; color:var(--cream); }
  .mm-brand span{ color:var(--chili); }
  .mm-sub{ font-size:12.5px; color:var(--cream-dim); margin-top:2px; }
  .mm-tabs{ display:flex; gap:2px; overflow-x:auto; padding:0 12px; background:var(--surface); border-bottom:1px solid var(--line); }
  .mm-tabbtn{ background:none; border:none; color:var(--cream-dim); padding:14px 12px; font-size:14px; font-weight:600; border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; }
  .mm-tabbtn.active{ color:var(--scallion); border-bottom-color:var(--scallion); }

  /* Hamburger button */
  .mm-hamburger{ background:none; border:1px solid var(--line); border-radius:8px; width:40px; height:40px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; padding:0; }
  .mm-hamburger span{ display:block; width:20px; height:2px; background:var(--cream); border-radius:2px; transition:transform .2s, opacity .2s; }
  .mm-hamburger[aria-expanded="true"] span:nth-child(1){ transform:translateY(6px) rotate(45deg); }
  .mm-hamburger[aria-expanded="true"] span:nth-child(2){ opacity:0; }
  .mm-hamburger[aria-expanded="true"] span:nth-child(3){ transform:translateY(-6px) rotate(-45deg); }

  /* Off-canvas drawer + scrim */
  #mm-scrim{ position:fixed; inset:0; background:rgba(42,27,10,.45); opacity:0; pointer-events:none; transition:opacity .25s; z-index:40; }
  #mm-scrim.open{ opacity:1; pointer-events:auto; }
  #mm-drawer{ position:fixed; top:0; left:0; bottom:0; width:82%; max-width:300px; background:var(--surface); box-shadow:2px 0 18px rgba(42,27,10,.18); transform:translateX(-105%); transition:transform .25s ease; z-index:41; display:flex; flex-direction:column; overflow-y:auto; }
  #mm-drawer.open{ transform:translateX(0); }
  .mm-drawer-head{ display:flex; align-items:center; justify-content:space-between; padding:16px; border-bottom:1px solid var(--line); flex-shrink:0; }
  .mm-drawer-close{ background:none; border:1px solid var(--line); border-radius:8px; width:32px; height:32px; font-size:16px; color:var(--cream-dim); cursor:pointer; }
  #mm-drawer-nav{ padding:8px; }
  .mm-drawer-item{ display:block; width:100%; text-align:left; background:none; border:none; color:var(--cream); padding:13px 12px; font-size:15px; font-weight:600; font-family:'Sarabun',sans-serif; border-radius:8px; cursor:pointer; }
  .mm-drawer-item.active{ background:var(--scallion-dim); color:var(--scallion); }
  .mm-drawer-item:not(.active):hover{ background:var(--surface-2); }
  body.mm-drawer-locked{ overflow:hidden; }
  .mm-body{ padding:16px 12px 90px; max-width:800px; margin:0 auto; }
  .mm-section-title{ font-size:16px; font-weight:600; color:var(--cream-dim); margin:20px 2px 10px; }
  .mm-section-title:first-child{ margin-top:0; }
  .mm-hint{ font-size:13px; color:var(--cream-dim); margin:4px 2px 12px; line-height:1.5; }
  
  .mm-list-item{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; box-shadow:0 1px 3px rgba(22,35,61,.04); }
  .mm-li-main{ font-size:15px; font-weight:600; }
  .mm-li-sub{ font-size:13px; color:var(--cream-dim); margin-top:4px; }
  .mm-li-amount{ font-size:15px; font-family:'Kanit',sans-serif; font-weight:600; white-space:nowrap; }
  .mm-badge{ font-size:11px; padding:3px 8px; border-radius:20px; font-weight:600; }
  .mm-badge.low{ background:var(--chili-dim); color:var(--chili); }
  .mm-badge.ok{ background:var(--scallion-dim); color:var(--scallion); }
  .mm-del{ background:none; border:none; color:var(--chili); font-size:18px; cursor:pointer; padding:2px 6px; }
  
  .mm-form{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .mm-form-row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .mm-field{ flex:1; min-width:150px; }
  .mm-field label{ display:block; font-size:12px; font-weight:600; color:var(--cream-dim); margin-bottom:6px; }
  .mm-field input, .mm-field select{ width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--cream); border-radius:6px; padding:10px; font-size:14px; font-family:'Sarabun',sans-serif; }
  .mm-add-btn{ width:100%; background:var(--scallion); color:#fff; border:none; border-radius:8px; padding:12px; font-size:15px; font-weight:600; cursor:pointer; margin-top:8px; }
  .mm-add-btn.secondary{ background:var(--surface-2); color:var(--cream); border:1px solid var(--line); }

  .mm-stat-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px; margin-bottom:16px; }
  .mm-stat{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; box-shadow:0 1px 3px rgba(22,35,61,.04); }
  .mm-stat-label{ font-size:13px; color:var(--cream-dim); }
  .mm-stat-value{ font-size:24px; font-weight:700; font-family:'Kanit',sans-serif; margin-top:6px; }
  
  .mm-toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--cream); color:#fff; padding:12px 24px; border-radius:8px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .3s; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.15); }
  .mm-toast.show{ opacity:1; }
  .mm-empty{ text-align:center; padding:30px 10px; color:var(--cream-dim); font-size:14px; }
  
  .mm-lock{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; text-align:center; height:60vh; }
  .mm-lock input{ width:180px; text-align:center; letter-spacing:8px; font-size:24px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px; margin:20px 0; }
</style>
</head>
<body>
<div id="mm-root">
  <div class="mm-header">
    <button id="mm-hamburger-btn" class="mm-hamburger" aria-expanded="false" aria-controls="mm-drawer" aria-label="เปิดเมนู">
      <span></span><span></span><span></span>
    </button>
    <img src="" id="mm-header-logo" alt="Makin Mama" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;"/>
    <div style="flex:1;">
      <div class="mm-brand">มากิน <span>มาม่า</span></div>
      <div class="mm-sub">ระบบหลังบ้าน (Back-office System)</div>
    </div>
    <div id="mm-user-badge"></div>
  </div>

  <div id="mm-scrim"></div>
  <nav id="mm-drawer" aria-label="เมนูหลัก" aria-hidden="true">
    <div class="mm-drawer-head">
      <span class="mm-brand" style="font-size:18px;">เมนู</span>
      <button id="mm-drawer-close-btn" class="mm-drawer-close" aria-label="ปิดเมนู">✕</button>
    </div>
    <div id="mm-drawer-nav"></div>
  </nav>

  <div class="mm-body" id="mm-body"></div>
  <div class="mm-toast" id="mm-toast"></div>
</div>

    customers:[], custFormDraft:{phone:'',name:'',tags:'',notes:''}, editingCustId:null,
  };
  const SYNC_KEYS = ['menu','toppings','costs','stock','waste','settings','orders','staff','accessLog','timeLogs','customers'];

  function uid(){ return Math.random().toString(36).slice(2,9); }
  function baht(n){ return Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:0}); }
  function toast(msg){
    const t = document.getElementById('mm-toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove('show'), 2000);
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  // ใช้ localStorage เป็นแคช/ที่เก็บสำรองเสมอ และซิงค์ขึ้น Supabase ด้วยถ้าเชื่อมต่อไว้
  function loadData(key, fallback){
    try{ const r = localStorage.getItem('mm_bo_'+key); return r ? JSON.parse(r) : fallback; }
    catch(e){ return fallback; }
  }
  function saveDataLocal(key, val){
    try{ localStorage.setItem('mm_bo_'+key, JSON.stringify(val)); }
    catch(e){ console.error('Local save failed', e); toast('ไม่สามารถบันทึกข้อมูลในเครื่องได้ (Storage Error)'); }
  }
  function saveData(key, val){
    saveDataLocal(key, val);
    if(SYNC_KEYS.includes(key)) syncStore.save();
  }

  // --- SUPABASE (ซิงค์ข้ามอุปกรณ์แบบเรียลไทม์) ---
  // ซิงก์แบบรายรายการ: เครื่องอื่นเพิ่ม/แก้คนละรายการได้โดยไม่ทับกัน, ยอดสต๊อกส่งเป็นส่วนต่าง,
  // ของที่บันทึกตอนออฟไลน์จะถูกส่งขึ้นเมื่อกลับมาออนไลน์ ('orders' และ 'stock' ใช้ร่วมกับ POS หน้าร้าน)
  const SYNC_COLL = {orders:'orders', stock:'stock'};
  const syncKeys = {};
  SYNC_KEYS.forEach(k=>{ syncKeys[k] = k==='settings' ? {coll:'bo_doc'} : {list:true, coll:SYNC_COLL[k]||('bo_'+k), delta:k==='stock'?['qty']:undefined}; });
  const syncStore = MMSync.createStore({
    name:'bo', keys:syncKeys,
    get:key=>state[key],
    set:(key,val)=>{ state[key] = val; saveDataLocal(key, val); },
    onData:()=>{ if(state.loaded) render(); },
    onStatus:s=>{
      const wasOff = state.sync.state==='off';
      state.sync = s;
      // อัปเดตเฉพาะป้ายสถานะ (render ทั้งหน้าจะล้างช่องที่กำลังพิมพ์) ยกเว้นตอนเปลี่ยนระหว่างเชื่อมต่อ/ไม่เชื่อมต่อ
      if(state.loaded && wasOff !== (s.state==='off')) render(); else updateSyncBadges();
    },
  });
  function syncLabel(){
    const s = state.sync;
    if(s.state==='online') return '<span style="color:var(--scallion);">🟢 เชื่อมต่อแล้ว — ซิงค์กับทุกอุปกรณ์ของร้านแบบเรียลไทม์'+(s.pending?' (กำลังส่ง '+s.pending+' รายการ)':'')+'</span>';
    if(s.state==='offline') return '<span style="color:var(--yolk);">🟡 ออฟไลน์/กำลังเชื่อมต่อใหม่ — บันทึกในเครื่องไว้แล้ว'+(s.pending?' รอส่ง '+s.pending+' รายการ':'')+'</span>';
    if(s.state==='connecting') return '<span style="color:var(--cream-dim);">⏳ กำลังเชื่อมต่อ...</span>';
    return '<span style="color:var(--cream-dim);">🔴 ยังไม่ได้เชื่อมต่อ (ใช้ข้อมูลในเบราว์เซอร์นี้เท่านั้น)</span>';
  }
  function updateSyncBadges(){
    const el = document.getElementById('mm-sync-status'); if(el) el.innerHTML = syncLabel();
    const er = document.getElementById('mm-sync-error'); if(er) er.textContent = state.sync.error ? '⚠ '+state.sync.error : '';
    const db = document.getElementById('mm-dash-sync'); if(db) db.textContent = dashSyncText();
  }
  function dashSyncText(){
    const s = state.sync.state;
    return s==='online' ? '🟢 ซิงค์เรียลไทม์กับ Supabase (เห็นข้อมูลสดจากทุกอุปกรณ์)'
      : s==='offline' ? '🟡 ออฟไลน์ — แสดงข้อมูลล่าสุดในเครื่อง จะซิงค์ให้เมื่อกลับมาออนไลน์'
      : '🔄 อัปเดตทุก 6 วินาที (เฉพาะเบราว์เซอร์นี้ — ยังไม่ได้เชื่อมต่อ Supabase)';
  }
  async function connectSync(code){
    try{ if(await syncStore.start(code)) toast('เชื่อมต่อ Supabase แล้ว'); }
    catch(e){ toast(e.message); }
  }
  function disconnectSync(){
    syncStore.stop();
    toast('หยุดซิงค์แล้ว (ใช้ข้อมูลในเครื่องนี้ต่อไป ข้อมูลที่แก้จะถูกส่งขึ้นเมื่อเชื่อมต่อใหม่)');
  }

  function load(){
    state.menu = loadData('menu', []);
    // migrate legacy single-stockId menu items to recipe array format
    state.menu.forEach(m=>{ if(!m.recipe){ m.recipe = m.stockId ? [{stockId:m.stockId, qty:1}] : []; } });
    state.toppings = loadData('toppings', []);
    state.costs = loadData('costs', []);
    state.stock = loadData('stock', []);
    state.waste = loadData('waste', []);
    state.settings = loadData('settings', {ownerPin:'', estimatedBowlsPerMonth:600});
    // จำลองข้อมูลออเดอร์สำหรับทดสอบวิเคราะห์สถิติ (ปกติมาจากระบบหน้าร้าน)
    state.orders = loadData('orders', []); 
    state.staff = loadData('staff', []);
    state.accessLog = loadData('accessLog', []);
    state.timeLogs = loadData('timeLogs', []);
    state.customers = loadData('customers', []);
    state.loaded = true;
    const headerLogo = document.getElementById('mm-header-logo');
    if(headerLogo) headerLogo.src = LOGO_SRC;
    state.lastRefresh = new Date();
    if(state.tab==='dash' || state.tab==='reports') startAutoRefresh();
    syncStore.start();
    render();
  }

  let refreshTimer = null;
  function startAutoRefresh(){
    if(refreshTimer) return;
    refreshTimer = setInterval(()=>{
      if(state.sync.state!=='off') return; // ซิงค์กับ Supabase อยู่ ข้อมูลอัปเดตเองแล้ว ไม่ต้อง poll ซ้ำ
      // อ่านข้อมูลล่าสุดจาก localStorage ของเบราว์เซอร์นี้ซ้ำ เพื่อให้แดชบอร์ด/รายงานอัปเดตเองโดยไม่ต้องรีเฟรชหน้า
      state.orders = loadData('orders', state.orders);
      state.stock = loadData('stock', state.stock);
      state.costs = loadData('costs', state.costs);
      state.waste = loadData('waste', state.waste);
      state.lastRefresh = new Date();
      if(state.tab==='dash' || state.tab==='reports' || state.tab==='costs') render();
    }, 6000);
  }
  function stopAutoRefresh(){ if(refreshTimer){ clearInterval(refreshTimer); refreshTimer=null; } }
  function manualRefresh(){
    state.orders = loadData('orders', state.orders);
    state.stock = loadData('stock', state.stock);
    state.costs = loadData('costs', state.costs);
    state.waste = loadData('waste', state.waste);
    state.lastRefresh = new Date();
    render(); toast('รีเฟรชข้อมูลล่าสุดแล้ว');
  }
  function setTab(id){
    state.tab = id;
    if(id==='dash' || id==='reports') startAutoRefresh(); else stopAutoRefresh();
    closeDrawer();
    render();
  }

  // --- HAMBURGER / OFF-CANVAS DRAWER NAV ---
  function openDrawer(){
    const btn = document.getElementById('mm-hamburger-btn');
    const drawer = document.getElementById('mm-drawer');
    const scrim = document.getElementById('mm-scrim');
    if(!btn || !drawer || !scrim) return;
    btn.setAttribute('aria-expanded','true');
    drawer.classList.add('open');
    drawer.setAttribute('aria-hidden','false');
    scrim.classList.add('open');
    document.body.classList.add('mm-drawer-locked');
    const firstItem = drawer.querySelector('.mm-drawer-item, .mm-drawer-close');
    if(firstItem) firstItem.focus();
  }
  function closeDrawer(){
    const btn = document.getElementById('mm-hamburger-btn');
    const drawer = document.getElementById('mm-drawer');
    const scrim = document.getElementById('mm-scrim');
    if(!btn || !drawer || !scrim) return;
    const wasOpen = btn.getAttribute('aria-expanded')==='true';
    btn.setAttribute('aria-expanded','false');
    drawer.classList.remove('open');
    drawer.setAttribute('aria-hidden','true');
    scrim.classList.remove('open');
    document.body.classList.remove('mm-drawer-locked');
    if(wasOpen) btn.focus();
  }
  function toggleDrawer(){
    const btn = document.getElementById('mm-hamburger-btn');
    if(btn && btn.getAttribute('aria-expanded')==='true') closeDrawer(); else openDrawer();
  }
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){
      const btn = document.getElementById('mm-hamburger-btn');
      if(btn && btn.getAttribute('aria-expanded')==='true') closeDrawer();
    }
  });

  // --- STOCKS & INBOUND ---
  function addStock(name, unit, qty, low, cost){
    if(!name || !unit) return toast('กรุณากรอกข้อมูลให้ครบถ้วน');
    state.stock.push({id:uid(), name, unit, qty:Number(qty)||0, lowThreshold:Number(low)||0, costPerUnit:Number(cost)||0, addedBy: state.currentUser?state.currentUser.name:null});
    saveData('stock', state.stock); render(); toast('เพิ่มรายการสต๊อกแล้ว');
  }
  function deleteStock(id){ state.stock = state.stock.filter(s=>s.id!==id); saveData('stock', state.stock); render(); }
  
  function inboundStock(id, addedQty, totalCost){
    const s = state.stock.find(x=>x.id===id); if(!s) return;
    const qty = Number(addedQty); const cost = Number(totalCost);
    if(isNaN(qty) || qty<=0 || isNaN(cost) || cost<0) return toast('กรอกตัวเลขไม่ถูกต้อง');
    
    // คำนวณ Moving Average Cost
    const currentTotalValue = s.qty * s.costPerUnit;
    const newTotalValue = currentTotalValue + cost;
    s.qty += qty;
    s.costPerUnit = newTotalValue / s.qty; 
    
    saveData('stock', state.stock); render(); toast('รับเข้าสต๊อกและปรับปรุงต้นทุนเฉลี่ยแล้ว');
  }

  // --- DASHBOARD & FORECASTING ---
  // --- FINANCIAL MANAGEMENT (ต้นทุน + รายรับ-รายจ่าย + กำไรจริง) ---
  const COST_CATEGORIES = ['ค่าเช่า','สาธารณูปโภค','ค่าแรง','วัตถุดิบ','ภาษี','ซ่อมบำรุง','อื่นๆ'];
  function daysInMonth(dt){ return new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate(); }
  function addCost(name, category, amount, frequency){
    name=(name||'').trim(); const amt=Number(amount);
    if(!name || !amt || amt<=0) return toast('กรุณากรอกชื่อและจำนวนเงินให้ถูกต้อง');
    state.costs.push({id:uid(), name, category:category||'อื่นๆ', amount:amt, frequency:frequency||'รายเดือน', addedBy: state.currentUser?state.currentUser.name:null});
    saveData('costs', state.costs); render(); toast('เพิ่มรายการค่าใช้จ่ายแล้ว');
  }
  function deleteCost(id){ state.costs = state.costs.filter(c=>c.id!==id); saveData('costs', state.costs); render(); }
  function computeMonthlyFixedCosts(now){
    const dim = daysInMonth(now);
    let total=0; const breakdown={};
    state.costs.forEach(c=>{
      let monthly=0;
      if(c.frequency==='รายเดือน') monthly=c.amount;
      else if(c.frequency==='รายวัน') monthly=c.amount*dim;
      else monthly=c.amount; // ครั้งเดียว: นับเข้าเดือนนี้เสมอเพื่อความง่าย
      total+=monthly; breakdown[c.category]=(breakdown[c.category]||0)+monthly;
    });
    return {total, breakdown};
  }
  // คำนวณ COGS ของออเดอร์หนึ่งรายการ โดยจับคู่กับสูตรอาหารจริง (ถ้าไม่มีข้อมูลออเดอร์จากหน้าร้านจะได้ 0)
  function computeOrderCogs(order){
    let cogs=0;
    (order.items||[]).forEach(it=>{
      const m = state.menu.find(x=>x.id===it.refId);
      if(m) cogs += computeMenuCost(m.recipe) * (it.qty||1);
    });
    return cogs;
  }
  function computeFinancials(now){
    const todayStr = now.toDateString();
    let revToday=0, revMonth=0, cogsToday=0, cogsMonth=0, cntToday=0, cntMonth=0;
    state.orders.forEach(o=>{
      const d = new Date(o.time);
      const cogs = computeOrderCogs(o);
      if(d.toDateString()===todayStr){ revToday+=o.total; cogsToday+=cogs; cntToday++; }
      if(d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth()){ revMonth+=o.total; cogsMonth+=cogs; cntMonth++; }
    });
    const fixed = computeMonthlyFixedCosts(now);
    return {
      revToday, revMonth, cogsToday, cogsMonth, cntToday, cntMonth,
      grossProfitMonth: revMonth-cogsMonth,
      grossMarginMonth: revMonth>0 ? (revMonth-cogsMonth)/revMonth*100 : 0,
      fixedCostsMonth: fixed.total, fixedBreakdown: fixed.breakdown,
      netProfitMonth: revMonth - cogsMonth - fixed.total,
      hasOrders: state.orders.length>0,
    };
  }
  function computeStockForecast(days){
    days = days||14;
    const cutoff = Date.now() - days*24*60*60*1000;
    const usage = {};
    state.orders.forEach(o=>{
      if(new Date(o.time).getTime() < cutoff) return;
      (o.items||[]).forEach(it=>{
        const m = state.menu.find(x=>x.id===it.refId); if(!m) return;
        (m.recipe||[]).forEach(r=>{ usage[r.stockId] = (usage[r.stockId]||0) + r.qty*(it.qty||1); });
      });
    });
    return state.stock.map(s=>{
      const avgDaily = (usage[s.id]||0)/days;
      const daysLeft = avgDaily>0 ? s.qty/avgDaily : null;
      const reorderPoint = avgDaily*3;
      return {stock:s, avgDaily, daysLeft, reorderPoint, needsReorder: avgDaily>0 && s.qty<=reorderPoint};
    }).filter(f=>f.avgDaily>0).sort((a,b)=>a.daysLeft-b.daysLeft);
  }

  function renderCosts(){
    const showFin = canSeeFinancials();
    if(!showFin){
      return `<div class="mm-empty">🔒 ข้อมูลการเงินแสดงเฉพาะเจ้าของร้าน หรือเมื่อปลดล็อก PIN แล้วในหน้าแดชบอร์ด</div>`;
    }
    const now = new Date();
    const fin = computeFinancials(now);

    const catEntries = Object.entries(fin.fixedBreakdown).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxCat = Math.max(1, ...catEntries.map(e=>e[1]));
    const barsHtml = catEntries.map(([cat,val])=>`
      <div style="margin:8px 0;">

  // --- RECIPE MANAGEMENT (สูตรอาหาร + คำนวณต้นทุนต่อเมนู) ---
  function computeMenuCost(recipe){
    return (recipe||[]).reduce((sum,r)=>{
      const s = state.stock.find(x=>x.id===r.stockId);
      return sum + (s ? r.qty*s.costPerUnit : 0);
    }, 0);
  }
  function canSeeFinancials(){
    return !!(state.currentUser && state.currentUser.role==='เจ้าของร้าน') || state.unlocked;
  }
  function resetMenuForm(){
    state.recipeCart = [];
    state.menuFormDraft = {name:'', price:'', portion:'', method:''};
    state.editingMenuId = null;
  }
  function addRecipeLine(stockId, qty){
    const s = state.stock.find(x=>x.id===stockId);
    const qtyN = Number(qty);
    if(!s || !qtyN || qtyN<=0) return toast('กรุณาเลือกวัตถุดิบและใส่จำนวนให้ถูกต้อง');
    state.recipeCart.push({stockId, name:s.name, unit:s.unit, qty:qtyN});
    render();
  }
  function removeRecipeLine(idx){ state.recipeCart.splice(idx,1); render(); }
  function startEditMenu(id){
    const m = state.menu.find(x=>x.id===id); if(!m) return;
    state.editingMenuId = id;
    state.menuFormDraft = {name:m.name, price:String(m.price), portion:m.portion||'', method:m.method||''};
    state.recipeCart = (m.recipe||[]).map(r=>({...r, name:(state.stock.find(s=>s.id===r.stockId)||{}).name||'(ไม่พบวัตถุดิบ)', unit:(state.stock.find(s=>s.id===r.stockId)||{}).unit||''}));
    render();
  }
  function cancelEditMenu(){ resetMenuForm(); render(); }
  function submitMenu(name, price, portion, method){
    name=(name||'').trim(); const priceN=Number(price);
    if(!name || !priceN || priceN<=0) return toast('กรุณากรอกชื่อเมนูและราคาให้ถูกต้อง');
    if(state.recipeCart.length===0) return toast('กรุณาเพิ่มวัตถุดิบในสูตรอย่างน้อย 1 รายการ');
    const recipe = state.recipeCart.map(r=>({stockId:r.stockId, qty:r.qty}));
    if(state.editingMenuId){
      const m = state.menu.find(x=>x.id===state.editingMenuId);
      if(m){ m.name=name; m.price=priceN; m.portion=portion.trim(); m.method=method.trim(); m.recipe=recipe; }
      toast('แก้ไขสูตรอาหารแล้ว');
    } else {
      state.menu.push({id:uid(), name, price:priceN, portion:portion.trim(), method:method.trim(), recipe, addedBy: state.currentUser?state.currentUser.name:null});
      toast('เพิ่มเมนู+สูตรอาหารแล้ว');
    }
    saveData('menu', state.menu);
    resetMenuForm();
    render();
  }
  function deleteMenu(id){
    state.menu = state.menu.filter(m=>m.id!==id);
    if(state.editingMenuId===id) resetMenuForm();
    saveData('menu', state.menu); render();
  }

  // --- REPORTING & ANALYTICS (รายงานยอดขาย/สต๊อก/ต้นทุนอาหาร/พนักงาน) ---
  function reportSalesByDay(days){
    days = days||14;
    const map = {};
    state.orders.forEach(o=>{
      const d = new Date(o.time);
      if((Date.now()-d.getTime()) > days*86400000) return;
      const key = d.toLocaleDateString('th-TH',{day:'numeric',month:'short'});
      map[key] = (map[key]||0) + o.total;
    });
    return map;
  }
  function reportTopMenus(limit){
    const count = {};
    state.orders.forEach(o=>(o.items||[]).forEach(it=>{
      const key = it.name || (state.menu.find(m=>m.id===it.refId)||{}).name || 'ไม่ทราบชื่อ';
      count[key] = (count[key]||0) + (it.qty||1);
    }));
    return Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0, limit||5);
  }
  function reportFoodCost(){
    return state.menu.map(m=>{
      const cost = computeMenuCost(m.recipe);
      const pct = m.price>0 ? (cost/m.price*100) : 0;
      return {name:m.name, price:m.price, cost, pct, margin:m.price-cost};
    }).sort((a,b)=>b.pct-a.pct);
  }
  function reportStockMovement(days){
    days = days||30;
    const cutoff = Date.now() - days*86400000;
    const inbound = {}; // จากการ "รับเข้า" — เราไม่ได้เก็บ log inbound แยก จึงประมาณจาก waste/ออเดอร์เท่าที่มี
    const used = {}; const wasted = {};
    state.orders.forEach(o=>{
      if(new Date(o.time).getTime() < cutoff) return;
      (o.items||[]).forEach(it=>{
        const m = state.menu.find(x=>x.id===it.refId); if(!m) return;
        (m.recipe||[]).forEach(r=>{ used[r.stockId]=(used[r.stockId]||0)+r.qty*(it.qty||1); });
      });
    });
    state.waste.forEach(w=>{
      if(new Date(w.date||w.time||Date.now()).getTime() < cutoff) return;
      wasted[w.stockId] = (wasted[w.stockId]||0) + (w.qty||0);
    });
    return state.stock.map(s=>({
      stock:s, used: used[s.id]||0, wasted: wasted[s.id]||0,
    }));
  }
  function reportStaffPerformance(now){
    now = now || new Date();
    // นับยอดขายต่อพนักงาน ถ้าออเดอร์มีข้อมูลผู้ขาย (cashierName) จากระบบหน้าร้าน
    const salesByStaff = {};
    state.orders.forEach(o=>{
      const d = new Date(o.time);
      if(d.getFullYear()!==now.getFullYear() || d.getMonth()!==now.getMonth()) return;
      if(!o.cashierName) return;
      salesByStaff[o.cashierName] = (salesByStaff[o.cashierName]||0) + o.total;
    });
    const hasSalesAttribution = Object.keys(salesByStaff).length>0;
    const list = state.staff.map(s=>({
      name:s.name, role:s.role,
      hours: computeMonthlyHours(s.name, now),
      sales: salesByStaff[s.name]||0,
    })).sort((a,b)=>b.hours-a.hours);
    return [list, hasSalesAttribution];
  }
  function exportReportsCsv(){
    const now = new Date();
    let rows = [['ประเภทรายงาน','รายการ','รายละเอียด','จำนวน/มูลค่า','วันที่']];
    Object.entries(reportSalesByDay(60)).forEach(([day,total])=>rows.push(['ยอดขายรายวัน', day, '', total, '']));
    reportTopMenus(999).forEach(([name,qty])=>rows.push(['เมนูขายดี', name, '', qty, '']));
    reportFoodCost().forEach(r=>rows.push(['ต้นทุนอาหาร', r.name, 'ราคา '+r.price+' ต้นทุน '+r.cost.toFixed(2), r.pct.toFixed(1)+'%', '']));
    state.staff.forEach(s=>rows.push(['พนักงาน', s.name, s.role, computeMonthlyHours(s.name,now).toFixed(1)+' ชม.', '']));
    const csv = rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download = `makin-mama-reports-${now.getFullYear()}-${now.getMonth()+1}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('ส่งออกรายงานเป็น CSV แล้ว');
  }

  // --- CRM (ลูกค้าสัมพันธ์: ยอดซื้อประจำ / ลูกค้าประจำ / เมนูที่ชื่นชอบ / ช่วงเวลาที่มา) ---
  function resetCustForm(){ state.custFormDraft = {phone:'',name:'',tags:'',notes:''}; state.editingCustId = null; }
  function startEditCustomer(id){
    const c = state.customers.find(x=>x.id===id); if(!c) return;
    state.editingCustId = id;
    state.custFormDraft = {phone:c.phone, name:c.name||'', tags:(c.tags||[]).join(', '), notes:c.notes||''};
    render();
  }
  function cancelEditCustomer(){ resetCustForm(); render(); }
  function submitCustomer(phone, name, tagsStr, notes){
    phone=(phone||'').trim();
    if(!phone) return toast('กรุณากรอกเบอร์โทรลูกค้า');
    const tags = (tagsStr||'').split(',').map(t=>t.trim()).filter(Boolean);
    if(state.editingCustId){
      const c = state.customers.find(x=>x.id===state.editingCustId);
      if(c){ c.phone=phone; c.name=(name||'').trim(); c.tags=tags; c.notes=(notes||'').trim(); }
      toast('แก้ไขข้อมูลลูกค้าแล้ว');
    } else {
      if(state.customers.some(c=>c.phone===phone)) return toast('มีเบอร์นี้ในระบบแล้ว');
      state.customers.push({id:uid(), phone, name:(name||'').trim(), tags, notes:(notes||'').trim(), addedBy: state.currentUser?state.currentUser.name:null});
      toast('เพิ่มลูกค้าใหม่แล้ว');
    }
    saveData('customers', state.customers);
    resetCustForm(); render();
  }
  function deleteCustomer(id){
    state.customers = state.customers.filter(c=>c.id!==id);
    if(state.editingCustId===id) resetCustForm();
    saveData('customers', state.customers); render();
  }
  // คำนวณสถิติของลูกค้าคนหนึ่งจากออเดอร์จริง (ต้องมี order.customerPhone จากระบบหน้าร้าน)
  function computeCustomerStats(phone){
    const orders = state.orders.filter(o=>o.customerPhone===phone);
    const totalSpend = orders.reduce((s,o)=>s+o.total, 0);
    const visitCount = orders.length;
    const lastVisit = orders.length ? orders.map(o=>new Date(o.time)).sort((a,b)=>b-a)[0] : null;
    const itemCount = {};
    orders.forEach(o=>(o.items||[]).forEach(it=>{ itemCount[it.name]=(itemCount[it.name]||0)+(it.qty||1); }));
    const favoriteMenu = Object.entries(itemCount).sort((a,b)=>b[1]-a[1])[0];
    return {orders, totalSpend, visitCount, lastVisit, favoriteMenu: favoriteMenu?favoriteMenu[0]:null, avgSpend: visitCount>0?totalSpend/visitCount:0};
  }
  function computePeakHours(){
    const byHour = new Array(24).fill(0);
    state.orders.forEach(o=>{ byHour[new Date(o.time).getHours()]++; });
    return byHour;
  }
  const REGULAR_VISIT_THRESHOLD = 5;

      return `

      </div>
      <div class="mm-hint">
        ใส่ <b>รหัสร้าน</b> ชุดเดียวกันในทุกอุปกรณ์ที่ต้องการเห็นข้อมูลร่วมกัน (เครื่อง POS ที่ร้าน + มือถือเจ้าของร้าน) — ใส่ครั้งเดียวต่อเบราว์เซอร์ และใช้ได้กับทุกหน้า (หลังบ้าน / POS / สต๊อก)<br/>
        เก็บรหัสไว้เป็นความลับ ใครรู้รหัสจะเข้าถึงข้อมูลร้าน (ต้นทุน ค่าแรง กำไร) ได้ — ใส่ผิดได้ 5 ครั้งต่อ 15 นาที<br/>
        ข้อมูลเดิมในเครื่องจะถูกอัปโหลดขึ้นให้ตอนเชื่อมต่อครั้งแรก (ถ้าบน Supabase ยังไม่มีข้อมูลนั้น) · ถ้าเน็ตหลุด ใช้งานต่อได้ตามปกติ ระบบจะส่งข้อมูลที่ค้างให้เองเมื่อกลับมาออนไลน์
      </div>

      <div class="mm-section-title">การเชื่อมต่อภายนอกอื่นๆ</div>
      <div class="mm-form">
        <div class="mm-hint" style="margin:0 0 10px;">การเชื่อมต่อกับ Google Sheets ยังไม่พร้อมใช้งานในไฟล์นี้ เพราะต้องมีการตั้งค่า OAuth/Service Account และโค้ดฝั่งเซิร์ฟเวอร์เพิ่มเติม — เมื่อพร้อมพัฒนาส่วนนี้แจ้งได้เลย จะช่วยวางแผนสถาปัตยกรรมให้</div>
        <button class="mm-add-btn secondary" disabled style="opacity:.5;cursor:not-allowed;">🔗 เชื่อมต่อ Google Sheets (เร็วๆ นี้)</button>
      </div>
    `;
  }

  // --- STAFF MANAGEMENT (ลงเวลา / สิทธิ์ตามตำแหน่ง / เงินเดือนโดยประมาณ) ---
  function addStaff(name, role, wage){
    name = (name||'').trim();
    if(!name) return toast('กรุณากรอกชื่อพนักงาน');
    state.staff.push({id:uid(), name, role: role||ROLES[0], hourlyWage: Number(wage)||0});
    saveData('staff', state.staff); render(); toast('เพิ่มพนักงานแล้ว');
  }
  function deleteStaff(id){ state.staff = state.staff.filter(s=>s.id!==id); saveData('staff', state.staff); render(); }

  function openTimeEntry(name){
    return state.timeLogs.find(t=>t.name===name && !t.clockOut);
  }
  function clockIn(){
    if(!state.currentUser) return;
    if(openTimeEntry(state.currentUser.name)) return toast('คุณลงเวลาเข้างานไว้แล้ว');
    state.timeLogs.push({id:uid(), name:state.currentUser.name, role:state.currentUser.role, clockIn:new Date().toISOString(), clockOut:null, hours:null});
    saveData('timeLogs', state.timeLogs); render(); toast('ลงเวลาเข้างานแล้ว');
  }
  function clockOut(){
    if(!state.currentUser) return;
    const entry = openTimeEntry(state.currentUser.name);
    if(!entry) return toast('ยังไม่ได้ลงเวลาเข้างาน');
    entry.clockOut = new Date().toISOString();
    entry.hours = (new Date(entry.clockOut) - new Date(entry.clockIn)) / 3600000;
    saveData('timeLogs', state.timeLogs); render(); toast('ลงเวลาออกงานแล้ว ('+entry.hours.toFixed(2)+' ชม.)');
  }
  function computeMonthlyHours(name, now){
    now = now || new Date();
    return state.timeLogs.filter(t=>t.name===name && t.hours!=null && new Date(t.clockIn).getFullYear()===now.getFullYear() && new Date(t.clockIn).getMonth()===now.getMonth())
      .reduce((s,t)=>s+t.hours, 0);
  }

  function renderStaff(){
    const showFin = canSeeFinancials();
    const managerView = isManager();
    const myOpenEntry = state.currentUser ? openTimeEntry(state.currentUser.name) : null;

    const clockCard = `
      <div class="mm-form">
        <div class="mm-li-main" style="margin-bottom:8px;">${myOpenEntry ? '🟢 กำลังทำงานอยู่ (เข้างานเมื่อ '+new Date(myOpenEntry.clockIn).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+')' : '⚪ ยังไม่ได้ลงเวลาเข้างาน'}</div>
        <button class="mm-add-btn" id="mm-clockin-btn" ${myOpenEntry?'disabled style="opacity:.5;cursor:not-allowed;"':''}>เข้างาน</button>
        <button class="mm-add-btn secondary" id="mm-clockout-btn" ${!myOpenEntry?'disabled style="opacity:.5;cursor:not-allowed;"':''}>ออกงาน</button>
      </div>`;

    const roleOpts = ROLES.map(r=>`<option value="${r}">${r}</option>`).join('');
    const staffList = state.staff.map(s=>{
      const monthlyHours = computeMonthlyHours(s.name);
      const pay = monthlyHours * (s.hourlyWage||0);
      return `
      <div class="mm-list-item">
        <div>
          <div class="mm-li-main">${escapeHtml(s.name)}</div>
          <div class="mm-li-sub">${escapeHtml(s.role)}${showFin && s.hourlyWage ? ' · ฿'+baht(s.hourlyWage)+'/ชม.' : ''}</div>
          ${showFin ? '<div class="mm-li-sub">เดือนนี้: '+monthlyHours.toFixed(1)+' ชม. · ประมาณการค่าแรง ฿'+baht(pay)+'</div>' : ''}
        </div>
        <button class="mm-del" data-del-staff="${s.id}">✕</button>
      </div>`;
    }).join('') || '<div class="mm-empty">ยังไม่มีรายชื่อพนักงาน</div>';

    const logRows = state.timeLogs.slice().reverse().slice(0,30).map(t=>`
      <div class="mm-list-item">
        <div><div class="mm-li-main">${escapeHtml(t.name)}</div><div class="mm-li-sub">${escapeHtml(t.role)}</div></div>
        <div style="text-align:right;">
          <div class="mm-li-sub">${new Date(t.clockIn).toLocaleString('th-TH')} ${t.clockOut?'→ '+new Date(t.clockOut).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}):'(ยังไม่ออกงาน)'}</div>
          ${t.hours!=null?'<div class="mm-li-sub">'+t.hours.toFixed(2)+' ชม.</div>':''}
        </div>
      </div>`).join('') || '<div class="mm-empty">ยังไม่มีประวัติลงเวลา</div>';

    const accessRows = state.accessLog.slice().reverse().slice(0,20).map(l=>`
      <div class="mm-list-item">
        <div><div class="mm-li-main">${escapeHtml(l.name)} <span class="mm-badge ${l.action==='login'?'ok':'low'}">${l.action==='login'?'เข้าสู่ระบบ':'ออกจากระบบ'}</span></div><div class="mm-li-sub">${escapeHtml(l.role)}</div></div>
        <div class="mm-li-sub">${new Date(l.time).toLocaleString('th-TH')}</div>
      </div>`).join('') || '<div class="mm-empty">ยังไม่มีประวัติการเข้าใช้งาน</div>';

    return `
      <div class="mm-section-title">ลงเวลาทำงานของฉัน</div>
      ${clockCard}

      ${managerView ? `
      <div class="mm-section-title">รายชื่อพนักงาน & สิทธิ์ตามตำแหน่ง</div>
      ${staffList}
      <div class="mm-form">
        <div class="mm-form-row">
          <div class="mm-field"><label>ชื่อพนักงาน</label><input id="stf-name" placeholder="ชื่อจริง"/></div>
          <div class="mm-field"><label>ตำแหน่ง</label><select id="stf-role">${roleOpts}</select></div>
          <div class="mm-field"><label>ค่าแรง (฿/ชม.)</label><input id="stf-wage" type="number" placeholder="0"/></div>
        </div>
        <button class="mm-add-btn" id="mm-add-staff-btn">+ เพิ่มพนักงาน</button>
      </div>
      <div class="mm-hint">"เจ้าของร้าน"และ"ผู้จัดการ" เข้าแท็บ "ตั้งค่าระบบ" และหน้านี้ได้เต็มสิทธิ์ · ค่าแรง/ประมาณการเงินเดือนจะแสดงเฉพาะเมื่อปลดล็อกข้อมูลการเงินแล้ว (เจ้าของร้าน หรือใส่ PIN)</div>

      <div class="mm-section-title">ประวัติลงเวลาเข้า-ออกงาน</div>
      ${logRows}

      <div class="mm-section-title">ประวัติการเข้าใช้งานระบบ (Access Log)</div>
      <div class="mm-hint">บันทึกอัตโนมัติทุกครั้งที่มีคนเข้า/ออกจากระบบ เพื่อตรวจสอบย้อนหลังได้ว่าใครเข้ามาจัดการข้อมูลช่วงไหนบ้าง</div>
      ${accessRows}
      ` : `<div class="mm-hint" style="margin-top:16px;">🔒 รายชื่อพนักงาน ประวัติลงเวลาของทุกคน และประวัติการเข้าใช้งาน แสดงเฉพาะเจ้าของร้าน/ผู้จัดการเท่านั้น</div>`}
    `;
  }

  // --- RENDER & EVENTS ---
  function render(){
    const drawerNavEl = document.getElementById('mm-drawer-nav');
    const hamburgerBtn = document.getElementById('mm-hamburger-btn');
    const bodyEl = document.getElementById('mm-body');
    const userBadge = document.getElementById('mm-user-badge');
    if(!state.loaded) return;

    if(!state.currentUser){
      if(drawerNavEl) drawerNavEl.innerHTML = '';
      if(hamburgerBtn) hamburgerBtn.style.display = 'none';
      closeDrawer();
      if(userBadge) userBadge.innerHTML = '';
      bodyEl.innerHTML = renderLogin();
      bindEvents();
      return;
    }
    if(hamburgerBtn) hamburgerBtn.style.display = '';
    if(userBadge) userBadge.innerHTML = `<div style="text-align:right;"><div style="font-size:13px;font-weight:600;">👤 ${escapeHtml(state.currentUser.name)}</div><div style="font-size:11px;color:var(--cream-dim);">${escapeHtml(state.currentUser.role)}</div></div><button id="mm-logout-btn" class="mm-add-btn secondary" style="width:auto;padding:5px 10px;font-size:12px;margin-top:4px;">ออกจากระบบ</button>`;

    if(drawerNavEl) drawerNavEl.innerHTML = TABS.map(t=>`<button class="mm-drawer-item ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');

    if(state.tab==='dash') bodyEl.innerHTML = renderDash();
    else if(state.tab==='reports') bodyEl.innerHTML = renderReports();
    else if(state.tab==='stock') bodyEl.innerHTML = renderStock();
    else if(state.tab==='menu') bodyEl.innerHTML = renderMenu();
    else if(state.tab==='costs') bodyEl.innerHTML = renderCosts();
    else if(state.tab==='crm') bodyEl.innerHTML = renderCrm();
    else if(state.tab==='staff') bodyEl.innerHTML = renderStaff();
    else if(state.tab==='settings') bodyEl.innerHTML = renderSettings();
    else bodyEl.innerHTML = `<div class="mm-empty">อยู่ระหว่างการพัฒนาโครงสร้างหมวดหมู่ใหม่</div>`;
    
    bindEvents();
  }

  function bindEvents(){
    document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>setTab(el.dataset.tab)));

    const hamburgerBtn = document.getElementById('mm-hamburger-btn');
    if(hamburgerBtn && !hamburgerBtn.dataset.bound){
      hamburgerBtn.dataset.bound = '1';
      hamburgerBtn.addEventListener('click', toggleDrawer);
    }
    const drawerCloseBtn = document.getElementById('mm-drawer-close-btn');
    if(drawerCloseBtn && !drawerCloseBtn.dataset.bound){
      drawerCloseBtn.dataset.bound = '1';
      drawerCloseBtn.addEventListener('click', closeDrawer);
    }
    const scrim = document.getElementById('mm-scrim');
    if(scrim && !scrim.dataset.bound){
      scrim.dataset.bound = '1';
      scrim.addEventListener('click', closeDrawer);
    }

    // Login / logout
    document.querySelectorAll('[data-login-as]').forEach(el=>el.addEventListener('click',()=>{
      const [name,role] = el.dataset.loginAs.split('|'); loginAs(name, role);
    }));
    const loginNameInput = document.getElementById('login-name');
    if(loginNameInput) loginNameInput.addEventListener('input', ()=>{ state.loginInput = loginNameInput.value; });
    const loginBtn = document.getElementById('mm-login-btn');
    if(loginBtn) loginBtn.addEventListener('click', ()=>loginAs(document.getElementById('login-name').value, document.getElementById('login-role').value));
    const logoutBtn = document.getElementById('mm-logout-btn');
    if(logoutBtn) logoutBtn.addEventListener('click', logout);
    document.querySelectorAll('[data-del-staff]').forEach(el=>el.addEventListener('click',()=>deleteStaff(el.dataset.delStaff)));
    const addStaffBtn = document.getElementById('mm-add-staff-btn');
    if(addStaffBtn) addStaffBtn.addEventListener('click', ()=>addStaff(document.getElementById('stf-name').value, document.getElementById('stf-role').value, document.getElementById('stf-wage').value));
    const clockInBtn = document.getElementById('mm-clockin-btn');
    if(clockInBtn) clockInBtn.addEventListener('click', clockIn);
    const clockOutBtn = document.getElementById('mm-clockout-btn');
    if(clockOutBtn) clockOutBtn.addEventListener('click', clockOut);
    
    // Inbound & Stock
    const addStockBtn = document.getElementById('mm-add-stock-btn');
    if(addStockBtn) addStockBtn.addEventListener('click', ()=>addStock(document.getElementById('st-name').value, document.getElementById('st-unit').value, document.getElementById('st-qty').value, document.getElementById('st-low').value, document.getElementById('st-cost').value));
    
    const inboundBtn = document.getElementById('mm-inbound-btn');
    if(inboundBtn) inboundBtn.addEventListener('click', ()=>inboundStock(document.getElementById('in-stock').value, document.getElementById('in-qty').value, document.getElementById('in-cost').value));
    
    document.querySelectorAll('[data-del-stock]').forEach(el=>el.addEventListener('click',()=>deleteStock(el.dataset.delStock)));

    // CRM
    document.querySelectorAll('[data-del-cust]').forEach(el=>el.addEventListener('click',()=>deleteCustomer(el.dataset.delCust)));
    document.querySelectorAll('[data-edit-cust]').forEach(el=>el.addEventListener('click',()=>startEditCustomer(el.dataset.editCust)));
    const cancelEditCustBtn = document.getElementById('mm-cancel-edit-cust-btn');
    if(cancelEditCustBtn) cancelEditCustBtn.addEventListener('click', cancelEditCustomer);
    const submitCustBtn = document.getElementById('mm-submit-cust-btn');
    if(submitCustBtn) submitCustBtn.addEventListener('click', ()=>submitCustomer(
      document.getElementById('cust-phone').value, document.getElementById('cust-name').value,
      document.getElementById('cust-tags').value, document.getElementById('cust-notes').value));

    // Costs / Financial
    document.querySelectorAll('[data-del-cost]').forEach(el=>el.addEventListener('click',()=>deleteCost(el.dataset.delCost)));
    const addCostBtn = document.getElementById('mm-add-cost-btn');
    if(addCostBtn) addCostBtn.addEventListener('click', ()=>addCost(
      document.getElementById('cf-name').value, document.getElementById('cf-cat').value,
      document.getElementById('cf-amount').value, document.getElementById('cf-freq').value));

    // Menu / Recipe
    function captureMenuDraft(){
      const nameEl=document.getElementById('mf-name'), priceEl=document.getElementById('mf-price'), portionEl=document.getElementById('mf-portion'), methodEl=document.getElementById('mf-method');
      if(nameEl) state.menuFormDraft = {
        name: nameEl.value, price: priceEl?priceEl.value:'', portion: portionEl?portionEl.value:'', method: methodEl?methodEl.value:''
      };
    }
    document.querySelectorAll('[data-rm-recipe-line]').forEach(el=>el.addEventListener('click',()=>{ captureMenuDraft(); removeRecipeLine(Number(el.dataset.rmRecipeLine)); }));
    const addRecipeLineBtn = document.getElementById('mm-add-recipeline-btn');
    if(addRecipeLineBtn) addRecipeLineBtn.addEventListener('click', ()=>{
      captureMenuDraft();
      addRecipeLine(document.getElementById('rl-stock').value, document.getElementById('rl-qty').value);
    });
    document.querySelectorAll('[data-edit-menu]').forEach(el=>el.addEventListener('click',()=>startEditMenu(el.dataset.editMenu)));
    const cancelEditBtn = document.getElementById('mm-cancel-edit-menu-btn');
    if(cancelEditBtn) cancelEditBtn.addEventListener('click', cancelEditMenu);
    const submitMenuBtn = document.getElementById('mm-submit-menu-btn');
    if(submitMenuBtn) submitMenuBtn.addEventListener('click', ()=>submitMenu(
      document.getElementById('mf-name').value, document.getElementById('mf-price').value,
      document.getElementById('mf-portion').value, document.getElementById('mf-method').value));
    document.querySelectorAll('[data-del-menu]').forEach(el=>el.addEventListener('click',()=>deleteMenu(el.dataset.delMenu)));

    // Dash (PIN)
    const pinSubmit = document.getElementById('mm-pin-submit');
    if(pinSubmit) pinSubmit.addEventListener('click', ()=>{
      if(document.getElementById('mm-pin-input').value === state.settings.ownerPin){ state.unlocked=true; render(); }
      else toast('รหัส PIN ไม่ถูกต้อง');
    });
    const relockBtn = document.getElementById('mm-relock-btn');
    if(relockBtn) relockBtn.addEventListener('click', ()=>{ state.unlocked=false; render(); });
    const refreshNowBtn = document.getElementById('mm-refresh-now-btn');
    if(refreshNowBtn) refreshNowBtn.addEventListener('click', manualRefresh);
    const exportReportsBtn = document.getElementById('mm-export-reports-btn');
    if(exportReportsBtn) exportReportsBtn.addEventListener('click', exportReportsCsv);

    // Settings
    const savePinBtn = document.getElementById('mm-save-pin-btn');
    if(savePinBtn) savePinBtn.addEventListener('click', ()=>{
      state.settings.ownerPin = document.getElementById('set-pin').value.trim();
      saveData('settings', state.settings);
      state.unlocked = false; toast('บันทึก PIN แล้ว'); render();
    });
    const connectSyncBtn = document.getElementById('mm-connect-sync-btn');
    if(connectSyncBtn) connectSyncBtn.addEventListener('click', ()=>{
      const code = document.getElementById('sync-code').value;
      if(!code){ toast('กรุณาใส่รหัสร้าน'); return; }
      connectSync(code);
    });
    const changeCodeBtn = document.getElementById('mm-change-code-btn');
    if(changeCodeBtn) changeCodeBtn.addEventListener('click', ()=>{
      const code = document.getElementById('sync-newcode').value;
      if(code.length<8){ toast('รหัสร้านต้องยาวอย่างน้อย 8 ตัวอักษร'); return; }
      MMSync.setCode(code).then(()=>toast('เปลี่ยนรหัสร้านแล้ว — อุปกรณ์ใหม่ต้องใช้รหัสนี้'), e=>toast('เปลี่ยนรหัสไม่สำเร็จ: '+e.message));
    });
    const disconnectSyncBtn = document.getElementById('mm-disconnect-sync-btn');
    if(disconnectSyncBtn) disconnectSyncBtn.addEventListener('click', disconnectSync);
  }

  load();
})();
</script>
</body>
</html>
